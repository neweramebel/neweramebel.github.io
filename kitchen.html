<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFBF4">
<title>Кухня на заказ — New Era Mebel</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FAFBF4;color:#171512;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#171512}a:hover{color:#566B0E}
i.s{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;letter-spacing:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;box-sizing:border-box;width:100%}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.hero-split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;align-items:center}
.glass{background:rgba(250,251,244,.74);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.nl{color:#34382B;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px;transition:background .25s,color .25s}
.nl:hover{background:rgba(23,21,18,.06);color:#171512}
.ib{width:44px;height:44px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;color:#171512;cursor:pointer;transition:background .25s}
.ib:hover{background:rgba(23,21,18,.08)}
.btn{display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:0 8px 0 22px;border-radius:999px;background:#171512;color:#FAFBF4;text-decoration:none;font-weight:500;font-size:15px;border:0;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn:hover{color:#FFFFFF;transform:translateY(-2px);box-shadow:0 16px 40px -18px rgba(23,21,18,.8)}
.btn .dot{width:36px;height:36px;border-radius:50%;background:#FAFBF4;color:#171512;display:inline-flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:hover .dot{transform:rotate(-45deg)}
.btn2{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;border-radius:999px;border:1px solid rgba(23,21,18,.22);color:#171512;text-decoration:none;font-weight:500;font-size:15px;background:transparent;cursor:pointer;transition:background .25s,border-color .25s}
.btn2:hover{background:rgba(23,21,18,.05);border-color:rgba(23,21,18,.5);color:#171512}
.tile{display:block;text-decoration:none;color:#171512}
.tile .ph{overflow:hidden;border-radius:20px;background:#F1FEC8}
.tile img{display:block;width:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tile:hover img{transform:scale(1.045)}
.tile:hover{color:#171512}
.tall{position:relative;display:block;border-radius:22px;overflow:hidden;text-decoration:none;color:#FAFBF4;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tall:hover{transform:translateY(-6px);color:#FFFFFF}
.tall img{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.tall:hover img{transform:scale(1.06)}
.fade{transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.bob{animation:bob 1.8s ease-in-out infinite}
.mqw{overflow:hidden;position:relative}
.mq{display:flex;width:max-content;animation:mq 40s linear infinite}
.mq.rev{animation-direction:reverse;animation-duration:70s}
.mqw:hover .mq{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 20s linear infinite}
.cursor{position:fixed;left:0;top:0;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(23,21,18,.5);pointer-events:none;z-index:100;transform:translate3d(-100px,-100px,0);display:none;mix-blend-mode:multiply}
@media (pointer:fine){.cursor{display:block}}
.par{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.hcard{position:relative;flex-shrink:0;border-radius:24px;overflow:hidden;background:#E6EDCF}
.pc-name{margin-top:10px;font-size:16px;font-weight:500;text-decoration:none;line-height:1.3}
.pc-size{font-size:13px;color:#5E6452;margin-top:4px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pc-price{font-size:20px;font-weight:600;letter-spacing:-.01em}
.pc-btn{min-height:44px;padding:0 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.pc-tag{position:absolute;top:14px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500}
.sh-shade{position:fixed;inset:0;z-index:90;background:rgba(23,21,18,.45);opacity:0;pointer-events:none;transition:opacity .35s}
.sh-shade.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:91;width:min(460px,100%);display:flex;flex-direction:column;background:#FAFBF4;box-shadow:-30px 0 80px -30px rgba(23,21,18,.45);transform:translateX(104%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
.drawer.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s 0s}
.dr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px 14px;border-bottom:1px solid rgba(23,21,18,.08)}
.dr-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 24px}
.dr-foot{padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid rgba(23,21,18,.08);background:#FAFBF4}
.ln{display:grid;grid-template-columns:80px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid rgba(23,21,18,.08)}
.ln img{display:block;width:80px;height:100px;border-radius:14px;object-fit:cover;background:#F1FEC8}
.ln-x{width:32px;height:32px;flex-shrink:0;border:0;border-radius:50%;background:transparent;color:#5E6452;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ln-x:hover{background:rgba(23,21,18,.06);color:#171512}
.qty{display:inline-flex;align-items:center;border:1px solid rgba(23,21,18,.18);border-radius:999px;padding:2px}
.qty button{width:34px;height:34px;border:0;background:transparent;font:inherit;font-size:18px;cursor:pointer;color:#171512;border-radius:50%}
.qty button:hover{background:rgba(23,21,18,.06)}
.lbl{display:block;font-size:14px;font-weight:600;margin:0 0 6px;padding:0}
.in{width:100%;box-sizing:border-box;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid rgba(23,21,18,.2);background:#FFFFFF;font:inherit;font-size:16px;color:#171512;outline:none;transition:border-color .2s}
.in:focus{border-color:#171512}
textarea.in{padding:12px 16px;min-height:88px;resize:vertical;line-height:1.5}
.pay{display:flex;gap:8px}
.payo{flex:1 1 0;position:relative;cursor:pointer}
.payo input{position:absolute;opacity:0;width:1px;height:1px}
.payo span{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;border:1px solid rgba(23,21,18,.2);background:#FFFFFF;font-weight:500;transition:background .2s,color .2s,border-color .2s}
.payo input:checked+span{background:#171512;color:#FAFBF4;border-color:#171512}
.payo input:focus-visible+span{outline:2px solid #566B0E;outline-offset:2px}
.err{padding:12px 14px;border-radius:12px;background:#F6E6D4;color:#7A3F14;font-size:14px;line-height:1.45}
.ok-box{padding:12px 14px;border-radius:12px;background:#E3EEDF;color:#2F6B3A;font-size:14px;font-weight:600}
.srch{position:fixed;inset:0;z-index:92;background:#FAFBF4;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.srch.open{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s 0s}
.srch-input{flex:1 1 auto;min-width:0;min-height:64px;border:0;border-bottom:2px solid #171512;background:transparent;font:inherit;font-size:30px;letter-spacing:-.02em;padding:0 2px;outline:none;color:#171512;border-radius:0}
.srch-input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sr-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px;margin-bottom:28px}
.toast{position:fixed;left:50%;bottom:22px;z-index:93;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 10px 10px 18px;border-radius:999px;background:#171512;color:#FAFBF4;font-size:14px;box-shadow:0 18px 40px -16px rgba(23,21,18,.6);transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.toast.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:#F1FEC8;color:#171512;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.fav-b{position:absolute;bottom:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(250,251,244,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s;color:#171512}
.fav-b:active{transform:scale(.9)}
.skel{background:linear-gradient(90deg,#EEF3DC 0%,#F6F9EA 50%,#EEF3DC 100%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}
.stars{display:flex;gap:2px}
.stars button{width:40px;height:40px;border:0;background:transparent;cursor:pointer;padding:0;color:#C9CFB4;display:flex;align-items:center;justify-content:center}
.stars button[aria-pressed="true"]{color:#566B0E}
@media (max-width:980px){.g4{gap:24px 12px}.pc-name{font-size:14px;margin-top:8px}.pc-size{font-size:12px}.pc-foot{flex-direction:column;align-items:stretch;gap:8px;margin-top:10px}.pc-price{font-size:17px}.pc-btn{min-height:40px;font-size:13px;padding:0 10px}.pc-tag{top:8px;padding:4px 8px;font-size:11px}.tile .ph{border-radius:16px}}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.two,.hero-split{grid-template-columns:minmax(0,1fr)}.navc{display:none!important}.wrap{padding:0 20px}.h1{font-size:40px!important}.h2{font-size:34px!important}.giant{font-size:26vw!important}}
@media (max-width:560px){.hdr{left:12px!important;right:12px!important;top:12px!important}.hide-s{display:none!important}.h-hint{bottom:132px!important}.h-card{left:16px;right:16px!important;bottom:20px!important;width:auto!important}.logo{padding:11px 16px!important}.srch-input{font-size:22px}.sr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rev-f{grid-template-columns:minmax(0,1fr)!important}}
@media (prefers-reduced-motion:reduce){.bob,.mq,.spin{animation:none}.fade{transition:none}}
</style>
<style>
.kx{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:start}
.shape{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;border-radius:18px;font:inherit;text-align:left;cursor:pointer;transition:background .2s,border-color .2s}
.rng{width:100%;accent-color:#171512}
.opt{min-height:52px;padding:0 16px;border-radius:14px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .2s,border-color .2s,color .2s}
.fld{width:100%;box-sizing:border-box;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid rgba(23,21,18,.2);background:#FFFFFF;font:inherit;font-size:16px;color:#171512;outline:none}
.fld:focus{border-color:#171512}
.blk{padding:28px;border-radius:24px;background:#F1FEC8}
@media (max-width:980px){.kx{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.shapes{grid-template-columns:repeat(2,minmax(0,1fr))!important}.blk{padding:22px 18px}.k-hero{height:auto!important;min-height:470px;border-radius:24px!important}.k-shade{background:linear-gradient(180deg,rgba(250,251,244,.96) 0%,rgba(250,251,244,.88) 52%,rgba(250,251,244,.1) 100%)!important}.k-txt{left:22px!important;right:22px;top:28px!important;transform:none!important}}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="position: relative; width: 100%; min-height: 100vh; background: #FAFBF4; overflow-x: clip">
<div ref="{{curRef}}" class="cursor" aria-hidden="true"></div>
<header class="hdr" style="position: fixed; top: 16px; left: 24px; right: 24px; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="index.html" class="glass logo" style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap; padding: 12px 20px; border-radius: 999px; text-decoration: none; color: #171512; border: 1px solid rgba(23,21,18,0.06)">
<span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">NEW ERA</span><i class="s" style="font-size: 19px">mebel</i>
</a>
<nav class="navc glass" aria-label="Главное меню" style="display: flex; gap: 2px; padding: 5px; border-radius: 999px; border: 1px solid rgba(23,21,18,0.06)">
<a class="nl" href="catalog.html">Каталог</a>
<a class="nl" href="kitchen.html">Кухни на заказ</a>
<a class="nl" href="catalog.html#kupe">Шкафы-купе</a>
<a class="nl" href="index.html">Доставка и оплата</a>
<a class="nl" href="index.html">Контакты</a>
</nav>
<div class="glass" style="display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; border: 1px solid rgba(23,21,18,0.06)">
<button type="button" class="ib hide-s" aria-label="Поиск" onClick="{{openSearch}}" style="background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg></button>
<a class="ib hide-s" href="catalog.html#fav" aria-label="Избранное" style="background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></a>
<button type="button" class="ib" aria-label="Корзина" onClick="{{openCart}}" style="position: relative; background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<sc-if value="{{hasCart}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #566B0E; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{cartCount}}</span></sc-if>
</button>
<a class="btn" href="kitchen.html" style="min-height: 44px; font-size: 14px; padding-left: 18px; padding-right: 5px; gap: 10px; white-space: nowrap"><span>Замер<span class="hide-s"> бесплатно</span></span><span class="dot" style="width: 34px; height: 34px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</div>
</header>
<main style="padding-top: 90px; padding-bottom: 100px">
<section class="wrap" style="position: relative; margin-bottom: 48px">
<div class="k-hero" style="position: relative; border-radius: 30px; overflow: hidden; height: 420px; background: #D9E2BC">
<img src="img/kitchen_full.jpg" alt="Кухня с островом, сделанная на заказ" class="par" data-par="0.14" style="object-position: 50% 60%">
<div class="k-shade" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(250,251,244,0.92) 0%, rgba(250,251,244,0.6) 38%, rgba(250,251,244,0) 62%)"></div>
<div class="k-txt" style="position: absolute; left: 48px; top: 50%; transform: translateY(-50%); max-width: 520px">
<nav aria-label="Навигация" style="display: flex; gap: 8px; font-size: 14px; color: #525846; margin-bottom: 18px"><a href="index.html" style="color: #525846; text-decoration: none">Главная</a><span aria-hidden="true">/</span><span style="color: #171512">Кухни на заказ</span></nav>
<h1 class="h1" style="margin: 0; font-size: 54px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 500">Кухня <i class="s" style="font-size: 1.12em">по вашим</i> размерам</h1>
<p style="margin: 18px 0 0; font-size: 17px; line-height: 1.6; color: #34382B">Соберите кухню ниже — сразу увидите примерную цену. Точную назовём после бесплатного замера.</p>
</div>
</div>
</section>

<div class="wrap kx">
<div style="display: flex; flex-direction: column; gap: 20px">
<div class="blk" data-rv="0">
<div style="font-size: 13px; color: #566B0E; font-weight: 600; letter-spacing: 0.08em">ШАГ 1</div>
<h2 style="margin: 6px 0 18px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Форма кухни</h2>
<div role="group" aria-label="Форма кухни" class="shapes" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{shapes}}" as="item" hint-placeholder-count="4">
<button type="button" class="shape" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="border: 1.5px solid {{item.bd}}; background: {{item.bg}}; color: #171512">
<svg width="64" height="48" viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}" fill="{{item.fill}}"></path></svg>
<span style="font-size: 15px; font-weight: 600">{{item.name}}</span>
</button>
</sc-for>
</div>
</div>

<div class="blk" data-rv="0">
<div style="font-size: 13px; color: #566B0E; font-weight: 600; letter-spacing: 0.08em">ШАГ 2</div>
<h2 style="margin: 6px 0 18px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Размеры</h2>
<div style="display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{dims}}" as="item" hint-placeholder-count="2">
<div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><label for="{{item.id}}" style="font-weight: 500">{{item.label}}</label><span style="font-size: 18px; font-weight: 600">{{item.text}}</span></div>
<input id="{{item.id}}" class="rng" type="range" min="{{item.min}}" max="{{item.max}}" step="0.1" value="{{item.value}}" onChange="{{item.change}}" style="margin-top: 10px">
</div>
</sc-for>
</div>
<p style="margin: 18px 0 0; font-size: 14px; color: #5E6452">Не знаете точно? Поставьте примерно — на замере всё измерим сами.</p>
</div>

<div class="blk" data-rv="0">
<div style="font-size: 13px; color: #566B0E; font-weight: 600; letter-spacing: 0.08em">ШАГ 3</div>
<h2 style="margin: 6px 0 18px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Фасады</h2>
<div role="group" aria-label="Фасады" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{facades}}" as="item" hint-placeholder-count="3">
<button type="button" class="opt" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="flex-direction: column; align-items: flex-start; justify-content: center; padding: 14px 16px; border: 1.5px solid {{item.bd}}; background: {{item.bg}}; color: #171512"><span>{{item.name}}</span><span style="font-size: 13px; font-weight: 400; color: #5E6452">{{item.note}}</span></button>
</sc-for>
</div>
<h3 style="margin: 24px 0 12px; font-size: 17px; font-weight: 600">Столешница</h3>
<div role="group" aria-label="Столешница" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tops}}" as="item" hint-placeholder-count="2">
<button type="button" class="opt" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="border: 1.5px solid {{item.bd}}; background: {{item.bg}}; color: #171512"><span>{{item.name}}</span><span style="font-size: 13px; font-weight: 400; color: #5E6452">{{item.note}}</span></button>
</sc-for>
</div>
<h3 style="margin: 24px 0 12px; font-size: 17px; font-weight: 600">Дополнительно</h3>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{extras}}" as="item" hint-placeholder-count="2">

<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    if (!this.curRef) this.curRef = { current: null };
    const s = this.state || {};
    // Цены за погонный метр — пример; брат задаёт их в кабинете.
    const N = window.NEM;
    const K = N.settings().kitchen || {};
    const kf = K.facade || {}, kt = K.top || {}, ke = K.extra || {};
    const num = (v, d) => (v === undefined || v === null || v === '' || isNaN(Number(v)) ? d : Number(v));
    const rate = (v) => N.fmt(v) + ' / м';
    const facadeDefs = [{ id: 'ldsp', name: 'ЛДСП', rate: num(kf.ldsp, 120000) }, { id: 'film', name: 'МДФ плёнка', rate: num(kf.film, 160000) }, { id: 'enamel', name: 'МДФ эмаль', rate: num(kf.enamel, 220000) }].map((f) => ({ ...f, note: rate(f.rate) }));
    const stoneR = num(kt.stone, 45000), ldspTopR = num(kt.ldsp, 0);
    const topDefs = [{ id: 'ldsp', name: 'ЛДСП 38 мм', note: ldspTopR ? '+' + rate(ldspTopR) : 'в цене', rate: ldspTopR }, { id: 'stone', name: 'Искусственный камень', note: '+' + rate(stoneR), rate: stoneR }];
    const extraDefs = [{ id: 'tall', name: 'Верх до потолка', pct: num(ke.tall_pct, 12) / 100, fix: 0 }, { id: 'led', name: 'LED-подсветка', pct: 0, fix: num(ke.led, 25000) }];
    const shapeDefs = [
      { id: 'line', name: 'Прямая', icon: 'M6 8h52v10H6z' },
      { id: 'corner', name: 'Угловая', icon: 'M6 8h52v10H16v24H6z' },
      { id: 'u', name: 'П-образная', icon: 'M6 8h52v34H48V18H16v24H6z' },
      { id: 'island', name: 'С островом', icon: 'M6 8h52v10H6zM18 28h28v10H18z' }
    ];
    const shape = s.shape || 'corner';
    const a = s.a || 3.2, b = s.b || 2.4, c = s.c || 2.4, isl = s.isl || 2.0;
    const facade = s.facade || 'film', top = s.top || 'ldsp', ex = s.ex || {};
    const fmt = (n) => (Math.round(n / 10000) * 10000).toLocaleString('ru-RU') + ' ₸';
    const m1 = (x) => x.toFixed(1).replace('.', ',') + ' м';
    const sel = (x) => (x ? { bd: '#171512', bg: '#FFFFFF' } : { bd: 'rgba(23,21,18,0.12)', bg: 'transparent' });
    const D = 0.6;
    let meters = a;
    if (shape === 'corner') meters = a + b - D;
    if (shape === 'u') meters = a + b + c - 2 * D;
    if (shape === 'island') meters = a + isl;
    const fr = facadeDefs.find((f) => f.id === facade).rate, tr = topDefs.find((t) => t.id === top).rate;
    let base = meters * (fr + tr);
    extraDefs.forEach((e) => { if (ex[e.id]) base = base * (1 + e.pct) + e.fix; });
    const range = 'от ' + fmt(base * 0.92) + ' до ' + fmt(base * 1.1);
    // plan geometry (meters → px)
    let W = a, H = D;
    if (shape === 'corner') H = b;
    if (shape === 'u') H = Math.max(b, c);
    if (shape === 'island') H = D + 1.1 + 0.9;
    const k = Math.min(380 / W, 240 / H), ox = 220 - (W * k) / 2, oy = 150 - (H * k) / 2;
    const R = (x, y, w, h, fill) => ({ x: (ox + x * k).toFixed(1), y: (oy + y * k).toFixed(1), w: (w * k).toFixed(1), h: (h * k).toFixed(1), fill: fill || '#E6DED2' });
    const rects = [R(0, 0, a, D)];
    const labels = [{ x: (ox + (a * k) / 2).toFixed(1), y: (oy - 8).toFixed(1), text: m1(a) }];
    if (shape === 'corner' || shape === 'u') { rects.push(R(0, D, D, b - D)); labels.push({ x: (ox + D * k + 26).toFixed(1), y: (oy + (b * k) / 2 + 4).toFixed(1), text: m1(b) }); }
    if (shape === 'u') { rects.push(R(a - D, D, D, c - D)); labels.push({ x: (ox + (a - D) * k - 26).toFixed(1), y: (oy + (c * k) / 2 + 4).toFixed(1), text: m1(c) }); }
    if (shape === 'island') { rects.push(R((a - isl) / 2, D + 1.1, isl, 0.9, '#D8CDBC')); labels.push({ x: (ox + (a * k) / 2).toFixed(1), y: (oy + (D + 1.1 + 0.9) * k + 18).toFixed(1), text: 'остров ' + m1(isl) }); }
    const dims = [{ id: 'da', label: 'Стена A', value: a, min: 1.2, max: 6, key: 'a' }];
    if (shape === 'corner' || shape === 'u') dims.push({ id: 'db', label: 'Стена B', value: b, min: 1.2, max: 5, key: 'b' });
    if (shape === 'u') dims.push({ id: 'dc', label: 'Стена C', value: c, min: 1.2, max: 5, key: 'c' });
    if (shape === 'island') dims.push({ id: 'di', label: 'Длина острова', value: isl, min: 1.2, max: 3.5, key: 'isl' });
    const fName = facadeDefs.find((f) => f.id === facade).name, tName = topDefs.find((t) => t.id === top).name;
    const shapeName = shapeDefs.find((x) => x.id === shape).name;
    this.lastVals = {
      curRef: this.curRef,
      shapes: shapeDefs.map((x) => ({ ...x, ...sel(x.id === shape), fill: x.id === shape ? '#D8CDBC' : 'none', pressed: x.id === shape ? 'true' : 'false', pick: () => this.setState({ shape: x.id }) })),
      dims: dims.map((d) => ({ ...d, text: m1(d.value), change: (e) => this.setState({ [d.key]: Number(e.target.value) }) })),
      facades: facadeDefs.map((f) => ({ ...f, ...sel(f.id === facade), pressed: f.id === facade ? 'true' : 'false', pick: () => this.setState({ facade: f.id }) })),
      tops: topDefs.map((t) => ({ ...t, ...sel(t.id === top), pressed: t.id === top ? 'true' : 'false', pick: () => this.setState({ top: t.id }) })),
      extras: extraDefs.map((e) => ({ name: e.name, ...sel(!!ex[e.id]), pressed: ex[e.id] ? 'true' : 'false', track: ex[e.id] ? '#171512' : 'rgba(23,21,18,0.2)', knob: ex[e.id] ? '19px' : '3px', toggle: () => this.setState({ ex: { ...ex, [e.id]: !ex[e.id] } }) })),
      meters: meters.toFixed(1).replace('.', ','), rects, labels,
      planLabel: 'План кухни: ' + shapeName.toLowerCase() + ', ' + meters.toFixed(1) + ' погонных метров',
      range,
      summary: shapeName + ' · ' + fName + ' · столешница ' + tName.toLowerCase() + '. Цена примерная, без техники и мойки.',
      sent: !!s.bkId, notSent: !s.bkId, bkId: s.bkId || '',
      bkErr: !!s.bkErr, bkErrText: s.bkErr || '', bkBusy: !!s.bkBusy, bkBtn: s.bkBusy ? 'Отправляем…' : 'Записаться на замер',
      minDate: this.dayStr(1), maxDate: this.dayStr(90), defDate: this.dayStr(1),
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.book({ shape: shapeName, a, b, c, isl, facade: fName, top: tName, extras: extraDefs.filter((x) => ex[x.id]).map((x) => x.name), meters: Number(meters.toFixed(1)), range }); },
      again: () => this.setState({ bkId: 0 })
    };
    const out = this.lastVals;
    return Object.assign(out, this.shopVals(s));
  }
  dayStr(add) { const d = new Date(Date.now() + add * 86400000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  book(calc) {
    const N = window.NEM, s = this.state || {};
    if (s.bkBusy) return;
    const v = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
    const o = { kind: v('k6') || 'kitchen', name: v('k1'), phone: v('k2'), address: v('k3'), date: v('k4') || null, time: v('k5'), calc: (v('k6') || 'kitchen') === 'kitchen' ? calc : null };
    if (o.name.trim().length < 2) return this.setState({ bkErr: 'Напишите ваше имя' });
    if (!N.normPhone(o.phone)) return this.setState({ bkErr: 'Проверьте номер: нужно 10 цифр после +7' });
    this.setState({ bkBusy: true, bkErr: '' });
    N.bookMeasure(o).then((r) => this.setState({ bkBusy: false, bkId: r.id })).catch((e) => this.setState({ bkBusy: false, bkErr: e.message }));
  }
  componentDidMount() { this.startFx(); this.shopMount(); }
  componentDidUpdate() { this.shopSync(); }
  componentWillUnmount() { this.stopFx(); this.shopUnmount(); }
  // ---- «живые» эффекты: параллакс фото, появление блоков, горизонтальная галерея, наклон карточек, курсор ----
  startFx() {
    this.fxDead = false;
    const mm = (q) => !!(window.matchMedia && window.matchMedia(q).matches);
    const reduce = mm('(prefers-reduced-motion: reduce)');
    const fine = mm('(pointer: fine)');
    let els = { par: [], rv: [], hs: [] }, n = 0;
    const q = () => {
      els = {
        par: Array.prototype.slice.call(document.querySelectorAll('[data-par]')),
        rv: Array.prototype.slice.call(document.querySelectorAll('[data-rv]')),
        hs: Array.prototype.slice.call(document.querySelectorAll('[data-hs]'))
      };
    };
    q();
    let cx = -100, cy = -100, tx = -100, ty = -100, big = 0, tbig = 0, tiltEl = null;
    const onMove = (e) => {
      tx = e.clientX; ty = e.clientY;
      const t = e.target && e.target.closest ? e.target : null;
      tbig = t && t.closest('a,button,input,select,label,[data-tilt]') ? 1 : 0;
      const el = t ? t.closest('[data-tilt]') : null;
      if (tiltEl && tiltEl !== el) { tiltEl.style.transform = ''; }
      tiltEl = el;
      if (el && fine && !reduce) {
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
        el.style.transition = 'transform .25s ease-out';
        el.style.transform = 'perspective(900px) rotateX(' + (-y * 7).toFixed(2) + 'deg) rotateY(' + (x * 9).toFixed(2) + 'deg) translateY(-6px)';
      }
    };
    const onOut = (e) => { if (!e.relatedTarget && tiltEl) { tiltEl.style.transform = ''; tiltEl = null; } };
    window.addEventListener('pointermove', onMove, { passive: true });
    document.addEventListener('pointerout', onOut);
    this.fxOff = () => { window.removeEventListener('pointermove', onMove); document.removeEventListener('pointerout', onOut); };
    const loop = () => {
      if (this.fxDead) return;
      if (++n % 45 === 0) q();
      const vh = window.innerHeight || 900, vw = window.innerWidth || 1440;
      if (!reduce) {
        for (let i = 0; i < els.par.length; i++) {
          const el = els.par[i], box = (el.parentElement || el).getBoundingClientRect();
          if (box.bottom < -200 || box.top > vh + 200) continue;
          const sp = parseFloat(el.getAttribute('data-par')) || 0.12;
          const c = (box.top + box.height / 2 - vh / 2) / vh;
          el.style.transform = 'translate3d(0,' + (-c * sp * 100).toFixed(2) + '%,0) scale(' + (1 + sp * 1.6).toFixed(3) + ')';
        }
      }
      for (let i = 0; i < els.rv.length; i++) {
        const el = els.rv[i];
        if (el.__rv === 2) continue;
        const r = el.getBoundingClientRect();
        const inView = r.top < vh * 0.92 && r.bottom > 0;
        if (!el.__rv) {
          el.__rv = 1;
          if (inView || reduce) { el.__rv = 2; continue; }
          el.style.transition = 'none'; el.style.opacity = '0'; el.style.transform = 'translate3d(0,40px,0)';
        } else if (inView) {
          const d = parseFloat(el.getAttribute('data-rv')) || 0;
          el.style.transition = 'opacity 1s cubic-bezier(.2,.8,.2,1) ' + d + 's, transform 1s cubic-bezier(.2,.8,.2,1) ' + d + 's';
          el.style.opacity = '1'; el.style.transform = 'none'; el.__rv = 2;
        }
      }
      for (let i = 0; i < els.hs.length; i++) {
        const sec = els.hs[i], track = sec.querySelector('[data-hs-track]');
        if (!track) continue;
        const r = sec.getBoundingClientRect();
        const p = Math.min(1, Math.max(0, -r.top / Math.max(1, r.height - vh)));
        const dist = Math.max(0, track.scrollWidth - vw + 60);
        track.style.transform = 'translate3d(' + (-p * dist).toFixed(1) + 'px,0,0)';
        const bar = sec.querySelector('[data-hs-bar]');
        if (bar) bar.style.transform = 'scaleX(' + p.toFixed(3) + ')';
      }
      const cur = this.curRef && this.curRef.current;
      if (cur && fine) {
        cx += (tx - cx) * 0.22; cy += (ty - cy) * 0.22; big += (tbig - big) * 0.15;
        cur.style.transform = 'translate3d(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + (1 + big * 1.5).toFixed(3) + ')';
      }
      this.fxRaf = requestAnimationFrame(loop);
    };
    this.fxRaf = requestAnimationFrame(loop);
  }
  stopFx() {
    this.fxDead = true;
    if (this.fxRaf) cancelAnimationFrame(this.fxRaf);
    if (this.fxOff) this.fxOff();
  }
  // ---- общее для страниц магазина: корзина, оформление, поиск ----
  shopVals(s) {
    const N = window.NEM;
    const lines = N.cart.lines();
    const cnt = N.cart.count();
    const step = s.coStep || 'cart';
    const st = N.settings();
    const meV = N.me.get();
    const q = s.q || '';
    const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const prods = N.state.products || [];
    const res = words.length ? prods.filter((p) => { const t = (p.name + ' ' + p.category + ' ' + (p.lead || '')).toLowerCase(); return words.every((w) => t.indexOf(w.slice(0, Math.max(3, w.length - 1))) >= 0); }) : prods.filter((p) => p.badge).concat(prods.filter((p) => !p.badge)).slice(0, 4);
    return {
      hasCart: cnt > 0, cartCount: cnt,
      cartCountText: cnt ? cnt + ' ' + N.plural(cnt, 'товар', 'товара', 'товаров') : '',
      openCart: () => this.setState({ cartOpen: true, searchOpen: false, toastOn: false, coStep: step === 'done' ? 'cart' : step, coErr: '' }),
      closeCart: () => this.setState({ cartOpen: false, coStep: step === 'done' ? 'cart' : step }),
      cartCls: s.cartOpen ? 'open' : '', cartHidden: s.cartOpen ? 'false' : 'true',
      drTitle: step === 'form' ? 'Оформление' : step === 'done' ? 'Спасибо!' : 'Корзина',
      coCart: step === 'cart', coForm: step === 'form', coDone: step === 'done',
      cartEmpty: !lines.length, cartHasItems: lines.length > 0,
      cartLines: lines.map((l) => ({
        ...l, sumText: N.fmt(l.sum), removeLabel: 'Убрать: ' + l.name,
        inc: () => N.cart.setQty(l.key, l.qty + 1),
        dec: () => (l.qty > 1 ? N.cart.setQty(l.key, l.qty - 1) : N.cart.remove(l.key)),
        remove: () => N.cart.remove(l.key)
      })),
      cartTotalText: N.fmt(N.cart.total()),
      showFoot: step !== 'done' && lines.length > 0,
      coNext: () => this.setState({ coStep: 'form', coErr: '' }),
      coBack: () => this.setState({ coStep: 'cart', coErr: '' }),
      meName: meV.name || '', mePhone: meV.phone || '', meAddr: meV.address || '',
      coErr: !!s.coErr, coErrText: s.coErr || '',
      coBusy: !!s.coBusy, coOp: s.coBusy ? 0.6 : 1, coBtn: s.coBusy ? 'Отправляем…' : 'Подтвердить заказ',
      coSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.coSubmit(); },
      doneId: s.doneId || '', doneTotal: N.fmt(s.doneTotal || 0), hasWa: !!N.normPhone(st.whatsapp),
      doneWa: N.waLink(st.whatsapp, 'Здравствуйте! Я оформил(а) заказ №' + (s.doneId || '') + ' на сайте New Era Mebel.'),
      openSearch: () => { this.setState({ searchOpen: true, cartOpen: false }); setTimeout(() => { const el = document.getElementById('srch-q'); if (el) el.focus(); }, 60); },
      closeSearch: () => this.setState({ searchOpen: false }),
      srchCls: s.searchOpen ? 'open' : '', srchHidden: s.searchOpen ? 'false' : 'true',
      q, setQ: (e) => this.setState({ q: e.target.value }),
      srchRes: res.slice(0, 12).map((p) => ({ id: p.id, name: p.name, img: N.imagesFor(p)[0], priceText: (p.sizes && p.sizes.length > 1 ? 'от ' : '') + N.fmt(Math.min.apply(null, [p.price].concat((p.sizes || []).map((z) => z.price)))) })),
      srchNone: words.length > 0 && !res.length,
      srchHint: words.length ? (res.length ? 'Нашли: ' + res.length : 'По запросу «' + q.trim() + '» ничего нет') : 'Популярное сейчас',
      toastCls: s.toastOn ? 'open' : '', toastText: s.toastText || '',
      favCount: N.fav.list().length
    };
  }
  coSubmit() {
    const N = window.NEM;
    if ((this.state || {}).coBusy) return;
    const v = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
    const payEl = document.querySelector('input[name="co-pay"]:checked');
    const o = { kind: 'cart', name: v('co-name'), phone: v('co-phone'), address: v('co-addr'), payment: payEl ? payEl.value : 'kaspi', comment: v('co-com') };
    if (o.name.trim().length < 2) return this.setState({ coErr: 'Напишите, как к вам обращаться' });
    if (!N.normPhone(o.phone)) return this.setState({ coErr: 'Проверьте номер телефона: нужно 10 цифр после +7' });
    if (o.address.trim().length < 3) return this.setState({ coErr: 'Укажите адрес доставки' });
    this.setState({ coBusy: true, coErr: '' });
    N.placeOrder(o).then((r) => { N.cart.clear(); this.setState({ coBusy: false, coStep: 'done', doneId: r.id, doneTotal: r.total }); })
      .catch((e) => this.setState({ coBusy: false, coErr: e.message || 'Не получилось отправить заказ' }));
  }
  toast(t) {
    clearTimeout(this.toastT);
    this.setState({ toastText: t, toastOn: true });
    this.toastT = setTimeout(() => this.setState({ toastOn: false }), 3500);
  }
  quickAdd(p) {
    const N = window.NEM;
    N.cart.add({ id: p.id, size: N.defSize(p), color: (p.colors || [])[0] || null, mirror: p.has_mirror ? 'one' : null, qty: 1 });
    this.toast('Добавлено в корзину: ' + p.name);
  }
  shopMount() {
    this.nemOff = window.NEM.on(() => this.setState({ nemT: Date.now() }));
    window.NEM.load();
    this.onEsc = (e) => { if (e.key === 'Escape') this.setState({ cartOpen: false, searchOpen: false, fOpen: false }); };
    window.addEventListener('keydown', this.onEsc);
    if (/[?&]cart=1/.test(location.search)) this.setState({ cartOpen: true });
  }

    if (this.nemOff) this.nemOff();
    window.removeEventListener('keydown', this.onEsc);
    clearTimeout(this.toastT);
    document.body.style.overflow = ''; document.body.classList.remove('nem-lock');
  }
  shopSync() {
    const s = this.state || {};
    const lock = !!(s.cartOpen || s.searchOpen || s.fOpen);
    document.body.style.overflow = lock ? 'hidden' : '';
    document.body.classList.toggle('nem-lock', lock);
  }
}
