<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F1">
<title>Товары и цены — кабинет New Era Mebel</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEM кабинет">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
html,body{height:100%}
body{margin:0;background:#DDE2E1;color:#1B1F22;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:#1B1F22}
i.s{font-family:inherit;font-style:normal;font-weight:inherit}
:root{--studio:linear-gradient(180deg,#C3CBCF 0%,#B4BEC3 64%,#A6B1B7 64%,#97A3A9 100%)}
.app{position:relative;width:100%;max-width:520px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#F2F3F1;box-shadow:0 0 0 1px rgba(27,31,34,.06),0 30px 80px -40px rgba(27,31,34,.5)}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px 150px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}
.press{transition:transform .15s,background .25s}
.press:active{transform:scale(.97)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.ib{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1px solid rgba(27,31,34,.12);background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#1B1F22;cursor:pointer;text-decoration:none}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hs::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:38px;padding:0 13px;border-radius:999px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.in{width:100%;box-sizing:border-box;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid rgba(27,31,34,.16);background:#FFFFFF;font:inherit;font-size:16px;color:#1B1F22;outline:none}
.in:focus{border-color:#1B1F22}
textarea.in{padding:10px 12px;min-height:76px;resize:vertical;line-height:1.45}
.num{text-align:right;font-variant-numeric:tabular-nums}
.lbl{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.sec{display:flex;flex-direction:column;gap:8px}
.row{border-radius:20px;background:#FFFFFF;overflow:hidden}
.b1{min-height:46px;padding:0 16px;border-radius:999px;border:0;background:#1B1F22;color:#F2F3F1;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.b1[disabled]{opacity:.5;cursor:default}
.b2{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid rgba(27,31,34,.2);background:transparent;color:#1B1F22;font:inherit;font-weight:500;font-size:13px;cursor:pointer}
.bd{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid rgba(138,74,28,.35);background:transparent;color:#8A4A1C;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.add{min-height:40px;width:100%;border-radius:12px;border:1px dashed rgba(27,31,34,.28);background:transparent;font:inherit;font-size:13px;color:#4E575E;cursor:pointer}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;padding:0 2px;border:0;background:transparent;font:inherit;font-size:15px;cursor:pointer;color:#1B1F22;text-align:left;width:100%}
.sw{position:relative;width:44px;height:26px;border-radius:999px;flex-shrink:0;transition:background .25s}
.sw i{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;transition:left .25s}
.ph{position:relative;width:72px;height:90px;border-radius:12px;overflow:hidden;background:var(--studio);flex-shrink:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;width:26px;height:26px;border-radius:50%;border:0;background:rgba(27,31,34,.75);color:#FFFFFF;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ph .x{top:4px;right:4px}
.ph .st{bottom:4px;left:4px}
.ph.main{outline:3px solid #1B1F22;outline-offset:-3px}
.upl{position:relative;width:72px;height:90px;border-radius:12px;border:1px dashed rgba(27,31,34,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#4E575E;font-size:11px;cursor:pointer;flex-shrink:0;text-align:center}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dsg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dsg-i{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#E4E8E7}
.dsg-i img{width:100%;height:100%;object-fit:cover;display:block}
.dsg-i.off img{opacity:.28;filter:grayscale(1)}
.dsg-b{position:absolute;bottom:6px;min-width:34px;height:34px;padding:0 8px;border-radius:999px;border:0;background:rgba(242,243,241,.94);color:#1B1F22;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.dsg .upl{width:auto;height:auto;aspect-ratio:1}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;margin-right:4px}
.err{padding:12px 14px;border-radius:12px;background:#F6E6D4;color:#7A3F14;font-size:14px;line-height:1.45}
.bar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 14px;border-radius:16px;background:#1B1F22;color:#F2F3F1;font-size:14px;font-weight:600;box-shadow:0 18px 40px -16px rgba(27,31,34,.6)}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">
<div class="app">
<div class="scroll">

<div style="display: flex; align-items: center; gap: 10px">
<a href="admin.html" class="ib" aria-label="Назад к заказам"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex-grow: 1; min-width: 0"><div style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em">Товары <i class="s" style="font-size: 1.1em">и цены</i></div><div style="font-size: 13px; color: #59626A">Меняете здесь — сразу меняется на сайте</div></div>
<button type="button" class="press" onClick="{{addProduct}}" aria-label="Добавить товар" disabled="{{busyAdd}}" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #1B1F22; color: #F2F3F1; font-size: 24px; cursor: pointer; flex-shrink: 0">+</button>
</div>

<sc-if value="{{needLogin}}" hint-placeholder-val="{{false}}"><div class="err">Нужно войти в кабинет. <a href="admin.html">Войти →</a></div></sc-if>
<sc-if value="{{hasErr}}" hint-placeholder-val="{{false}}"><div class="err" role="alert">{{errText}}</div></sc-if>

<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск товара</label>
<input id="q" class="in" type="search" placeholder="Поиск: шкаф, комод…" value="{{q}}" onChange="{{setQ}}">

<div class="hs" role="group" aria-label="Категории">
<sc-for list="{{chips}}" as="item" hint-placeholder-count="5">
<button type="button" class="chip" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}">{{item.label}}</button>
</sc-for>
</div>

<sc-if value="{{loading}}" hint-placeholder-val="{{false}}"><div style="padding: 30px; text-align: center; color: #59626A">Загружаем товары…</div></sc-if>

<sc-for list="{{rows}}" as="item" hint-placeholder-count="4">
<div class="row" style="border: 1px solid {{item.border}}">
<button type="button" onClick="{{item.toggleOpen}}" aria-expanded="{{item.expanded}}" style="display: flex; gap: 12px; align-items: center; padding: 12px; width: 100%; border: 0; background: transparent; font: inherit; color: #1B1F22; text-align: left; cursor: pointer">
<img src="{{item.img}}" alt="" style="width: 56px; height: 70px; border-radius: 12px; object-fit: cover; background: var(--studio); flex-shrink: 0">
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-weight: 600; font-size: 15px; line-height: 1.25">{{item.name}}</span>
<span style="display: block; font-size: 14px; margin-top: 3px">{{item.priceText}}</span>
<span style="display: block; margin-top: 5px"><span class="pill" style="background: {{item.stBg}}; color: {{item.stFg}}">{{item.stock}}</span><sc-if value="{{item.hidden}}"><span class="pill" style="background: #ECEAE6; color: #59626A">Скрыт</span></sc-if><sc-if value="{{item.hasBadge}}"><span class="pill" style="background: #1B1F22; color: #F2F3F1">{{item.badge}}</span></sc-if><sc-if value="{{item.dirty}}"><span class="pill" style="background: #F6E6D4; color: #8A4A1C">не сохранено</span></sc-if></span>
</span>
<span style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(27,31,34,0.16); display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; flex-shrink: 0">{{item.openLabel}}</span>
</button>
<sc-if value="{{item.open}}">
<div style="padding: 4px 14px 16px; border-top: 1px solid rgba(27,31,34,0.08); display: flex; flex-direction: column; gap: 18px">

<div class="sec" style="margin-top: 12px">
<label class="lbl" for="{{item.fid}}-name">Название</label>
<input id="{{item.fid}}-name" class="in" type="text" value="{{item.e.name}}" onChange="{{item.set.name}}">
<label class="lbl" for="{{item.fid}}-cat" style="margin-top: 6px">Категория</label>
<select id="{{item.fid}}-cat" class="in" value="{{item.e.category}}" onChange="{{item.set.category}}"><sc-for list="{{cats}}" as="c" hint-placeholder-count="8"><option value="{{c}}">{{c}}</option></sc-for></select>
</div>

<div class="sec">
<div class="lbl" style="margin: 0">Цены по размерам (сборка включена)</div>
<sc-if value="{{item.noSizes}}">
<div style="display: flex; align-items: center; gap: 8px"><label for="{{item.fid}}-price" style="flex-grow: 1; font-size: 15px">Цена</label><input id="{{item.fid}}-price" class="in num" type="number" inputmode="numeric" min="0" step="1000" value="{{item.e.price}}" onChange="{{item.set.price}}" style="width: 140px"><span style="font-size: 14px; color: #59626A">₸</span></div>
</sc-if>
<sc-for list="{{item.sizes}}" as="sz" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 120px 34px 34px; gap: 6px; align-items: center">
<input class="in" type="text" value="{{sz.label}}" onChange="{{sz.setLabel}}" aria-label="Размер" placeholder="160 см">
<input class="in num" type="number" inputmode="numeric" min="0" step="1000" value="{{sz.price}}" onChange="{{sz.setPrice}}" aria-label="{{sz.priceAria}}">
<button type="button" onClick="{{sz.makeDef}}" aria-pressed="{{sz.isDef}}" title="Основной размер (показывается первым)" aria-label="Сделать основным" style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(27,31,34,0.16); background: {{sz.defBg}}; color: {{sz.defFg}}; cursor: pointer; font-size: 14px">★</button>
<button type="button" onClick="{{sz.remove}}" aria-label="Убрать размер" style="width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(27,31,34,0.06); cursor: pointer; font-size: 15px; color: #1B1F22">×</button>
</div>
</sc-for>
<button type="button" class="add" onClick="{{item.addSize}}">+ Добавить размер</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<div><label class="lbl" for="{{item.fid}}-sl">Подпись к размерам</label><input id="{{item.fid}}-sl" class="in" type="text" value="{{item.e.size_label}}" onChange="{{item.set.size_label}}" placeholder="Ширина"></div>
<div><label class="lbl" for="{{item.fid}}-w">Ширина для фильтра, см</label><input id="{{item.fid}}-w" class="in num" type="number" inputmode="numeric" value="{{item.e.width_cm}}" onChange="{{item.set.width_cm}}"></div>
</div>
<div><label class="lbl" for="{{item.fid}}-st">Габариты (в карточке)</label><input id="{{item.fid}}-st" class="in" type="text" value="{{item.e.size_text}}" onChange="{{item.set.size_text}}" placeholder="160 × 220 × 60 см"></div>
<div><label class="lbl" for="{{item.fid}}-dm">Подробно о размерах</label><input id="{{item.fid}}-dm" class="in" type="text" value="{{item.e.dims}}" onChange="{{item.set.dims}}" placeholder="высота 220 · глубина 60 см"></div>
</div>

<div class="sec">
<div class="lbl" style="margin: 0">Цвета</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{item.colors}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px 0 6px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; font: inherit; font-size: 13px; cursor: pointer; color: #1B1F22"><span style="width: 20px; height: 20px; border-radius: 50%; background: {{c.hex}}; box-shadow: inset 0 0 0 1px rgba(27,31,34,0.2)"></span>{{c.name}}</button>
</sc-for>
</div>
</div>

<div class="sec">
<div class="lbl" style="margin: 0">Фото</div>
<div style="font-size: 12px; color: #59626A; margin-top: -4px">Фото сохраняются сразу. ★ — главное фото в каталоге.</div>
<sc-for list="{{item.groups}}" as="g" hint-placeholder-count="2">
<div style="font-size: 13px; color: #4E575E; margin-top: 4px">{{g.label}}</div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{g.photos}}" as="ph" hint-placeholder-count="2">
<div class="{{ph.cls}}"><img src="{{ph.src}}" alt=""><button type="button" class="x" onClick="{{ph.remove}}" aria-label="Удалить фото">✕</button><button type="button" class="st" onClick="{{ph.makeMain}}" aria-label="Сделать главным фото">★</button></div>
</sc-for>
<label class="upl"><input type="file" accept="image/*" multiple onChange="{{g.upload}}" aria-label="{{g.uploadAria}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>{{g.uplText}}</label>
</div>
</sc-for>
</div>

<div class="sec">
<button type="button" class="tg" onClick="{{item.tStock}}" aria-pressed="{{item.e.in_stock}}">Быстрое изготовление (выкл. — обычный срок)<span class="sw" style="background: {{item.k1.track}}"><i style="left: {{item.k1.knob}}"></i></span></button>
<button type="button" class="tg" onClick="{{item.tActive}}" aria-pressed="{{item.e.active}}">Показывать на сайте<span class="sw" style="background: {{item.k2.track}}"><i style="left: {{item.k2.knob}}"></i></span></button>
<button type="button" class="tg" onClick="{{item.tMirror}}" aria-pressed="{{item.e.has_mirror}}">Выбор зеркал (для шкафов-купе)<span class="sw" style="background: {{item.k3.track}}"><i style="left: {{item.k3.knob}}"></i></span></button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div><label class="lbl" for="{{item.fid}}-bd">Метка</label><select id="{{item.fid}}-bd" class="in" value="{{item.e.badge}}" onChange="{{item.set.badge}}"><option value="">Без метки</option><option value="Хит">Хит</option><option value="Новинка">Новинка</option><option value="Скидка">Скидка</option></select></div>
<div><label class="lbl" for="{{item.fid}}-so">Порядок в каталоге</label><input id="{{item.fid}}-so" class="in num" type="number" inputmode="numeric" value="{{item.e.sort}}" onChange="{{item.set.sort}}"></div>
</div>
</div>

<div class="sec">
<label class="lbl" for="{{item.fid}}-ld">Коротко (под названием)</label>
<textarea id="{{item.fid}}-ld" class="in" rows="2" value="{{item.e.lead}}" onChange="{{item.set.lead}}"></textarea>
<label class="lbl" for="{{item.fid}}-ds" style="margin-top: 6px">Описание</label>
<textarea id="{{item.fid}}-ds" class="in" rows="4" value="{{item.e.description}}" onChange="{{item.set.description}}"></textarea>
</div>

<sc-if value="{{item.hasRowErr}}"><div class="err" role="alert">{{item.rowErr}}</div></sc-if>
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
<button type="button" class="b1 press" onClick="{{item.save}}" disabled="{{item.saveOff}}" style="flex-grow: 1">{{item.saveLabel}}</button>
<sc-if value="{{item.dirty}}"><button type="button" class="b2" onClick="{{item.revert}}">Отменить</button></sc-if>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap">
<a href="{{item.viewHref}}" target="_blank" rel="noopener" style="font-size: 13px; color: #4E575E">Открыть на сайте ↗</a>
<sc-if value="{{item.notAskDel}}"><button type="button" class="bd" onClick="{{item.askDel}}">Удалить товар</button></sc-if>
<sc-if value="{{item.askingDel}}"><span style="display: flex; gap: 6px; align-items: center"><span style="font-size: 13px; color: #59626A">Точно?</span><button type="button" class="b2" onClick="{{item.noDel}}">Нет</button><button type="button" class="bd" onClick="{{item.del}}" style="background: #8A4A1C; color: #FFFFFF">Удалить</button></span></sc-if>
</div>
</div>
</sc-if>
</div>
</sc-for>

<div class="row" style="border: 1px solid rgba(27,31,34,0.08); padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div><div style="font-weight: 600">Цены: кухни, материалы, зеркала</div><div style="font-size: 13px; color: #59626A; margin-top: 2px">По этим цифрам сайт считает цены. Наценка за материал фасадов — в процентах к цене товара (ЛДСП — базовая).</div></div>
<sc-for list="{{kitchen}}" as="k" hint-placeholder-count="7">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
<label for="{{k.fid}}" style="font-size: 15px; line-height: 1.3">{{k.label}}</label>
<div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0"><input id="{{k.fid}}" class="in num" type="number" inputmode="numeric" min="{{k.min}}" step="{{k.step}}" value="{{k.value}}" onChange="{{k.change}}" style="width: 124px"><span style="font-size: 14px; color: #59626A; width: 14px">{{k.unit}}</span></div>
</div>
</sc-for>
<button type="button" class="b1 press" onClick="{{saveKitchen}}" disabled="{{kitOff}}">{{kitLabel}}</button>
</div>

<div class="row" style="border: 1px solid rgba(27,31,34,0.08); padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div><div style="font-weight: 600">Идеи на сайте — фото-примеры</div><div style="font-size: 13px; color: #59626A; margin-top: 2px; line-height: 1.45">Фото из интернета в разделе «Идеи». Нажмите «Скрыть», если фото не нравится. Можно добавить фото своих работ — они появятся первыми.</div></div>
<div style="display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none">
<sc-for list="{{dChips}}" as="c" hint-placeholder-count="9">
<button type="button" class="chip" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
</sc-for>
</div>
<sc-if value="{{dLoading}}"><div style="font-size: 14px; color: #59626A">Загружаем фото…</div></sc-if>
<div class="dsg">
<label class="upl"><input type="file" accept="image/*" multiple onChange="{{dUpload}}" aria-label="Добавить своё фото в идеи"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>{{dUplText}}</label>
<sc-for list="{{dItems}}" as="d" hint-placeholder-count="6">
<div class="dsg-i {{d.cls}}"><img src="{{d.src}}" alt="" loading="lazy"><button type="button" class="dsg-b" onClick="{{d.toggle}}" style="left: 6px">{{d.tLabel}}</button><sc-if value="{{d.own}}"><button type="button" class="dsg-b" onClick="{{d.del}}" aria-label="Удалить фото" style="right: 6px; color: #8A4A1C">✕</button></sc-if></div>
</sc-for>
</div>
<div style="font-size: 12px; color: #59626A">{{dStat}}</div>
</div>
</div>

<div class="bar">
<sc-if value="{{hasToast}}"><div class="toast pop" role="status">{{toast}}</div></sc-if>

    const d = { ...cur, ...(s.kd || {}) };
    const rows = [
      ['f_ldsp', 'Кухня, фасады ЛДСП, за метр', '₸', 5000, 0], ['f_film', 'Кухня, МДФ плёнка, за метр', '₸', 5000, 0], ['f_akril', 'Кухня, акрил, за метр', '₸', 5000, 0], ['f_enamel', 'Кухня, эмаль, за метр', '₸', 5000, 0], ['f_shpon', 'Кухня, шпон, за метр', '₸', 5000, 0],
      ['t_ldsp', 'Столешница ЛДСП, доплата за метр', '₸', 1000, 0], ['t_kompakt', 'Компакт-плита, доплата за метр', '₸', 1000, 0], ['t_stone', 'Искусственный камень, доплата за метр', '₸', 1000, 0], ['t_kvarc', 'Кварц, доплата за метр', '₸', 1000, 0], ['t_wood', 'Массив, доплата за метр', '₸', 1000, 0],
      ['x_tall', 'Верх до потолка, наценка', '%', 1, 0], ['x_led', 'LED-подсветка, за кухню', '₸', 1000, 0],
      ['m_two', 'Шкаф-купе: 2 зеркала, доплата', '₸', 1000, 0], ['m_none', 'Шкаф-купе: без зеркал, скидка', '₸', 1000, -1000000],
      ['p_mdf', 'Мебель: фасады МДФ, наценка', '%', 1, 0], ['p_akril', 'Мебель: фасады акрил, наценка', '%', 1, 0], ['p_emal', 'Мебель: фасады эмаль, наценка', '%', 1, 0], ['p_shpon', 'Мебель: фасады шпон, наценка', '%', 1, 0]
    ].map(([key, label, unit, step, min]) => ({ key, label, unit, step, min: 0, value: d[key] }));
    return { rows, d };
  }
  saveKitchen() {
    const N = window.NEM;
    const { d } = this.kitchenDraft();
    const n = (v) => Math.max(0, Math.round(Number(v) || 0));
    const patch = {
      kitchen: { facade: { ldsp: n(d.f_ldsp), film: n(d.f_film), akril: n(d.f_akril), enamel: n(d.f_enamel), shpon: n(d.f_shpon) }, top: { ldsp: n(d.t_ldsp), kompakt: n(d.t_kompakt), stone: n(d.t_stone), kvarc: n(d.t_kvarc), wood: n(d.t_wood) }, extra: { tall_pct: Math.min(100, n(d.x_tall)), led: n(d.x_led) } },
      mirror: { one: 0, two: n(d.m_two), none: -n(d.m_none) },
      materials: { ldsp: 0, mdf: Math.min(300, n(d.p_mdf)), akril: Math.min(300, n(d.p_akril)), emal: Math.min(300, n(d.p_emal)), shpon: Math.min(300, n(d.p_shpon)) }
    };
    this.setState({ kitBusy: true });
    N.admin.saveSettings(patch).then(() => { this.setState({ kitBusy: false, kitDirty: false, kd: {} }); this.say('Цены сохранены'); })
      .catch((e) => { this.setState({ kitBusy: false }); this.say(e.message); });
  }
  designVals(s) {
    const N = window.NEM, all = s.designs, cat = s.dCat || 'Кухни';
    const cats = ['Кухни'].concat(N.CATS);
    const list = (all || []).filter((d) => d.category === cat);
    const own = (d) => d.url.indexOf(N.URL) === 0;
    const on = list.filter((d) => d.active).length;
    return {
      dLoading: !all,
      dChips: cats.map((c) => { const n = (all || []).filter((d) => d.category === c && d.active).length; return { label: c + (all ? ' · ' + n : ''), pressed: c === cat ? 'true' : 'false', bg: c === cat ? '#1B1F22' : '#FFFFFF', fg: c === cat ? '#F2F3F1' : '#1B1F22', bd: c === cat ? '#1B1F22' : 'rgba(27,31,34,0.14)', pick: () => this.setState({ dCat: c }) }; }),
      dItems: list.map((d) => ({
        src: N.designSrc(d, 300), cls: d.active ? '' : 'off', own: own(d), tLabel: d.active ? 'Скрыть' : 'Показать',
        toggle: () => this.patchDesign(d, { active: !d.active }),
        del: () => this.delDesign(d)
      })),
      dStat: all ? 'На сайте: ' + on + ' из ' + list.length + ' в разделе «' + cat + '»' : '',
      dUplText: s.dUp ? 'Загрузка…' : 'Своё фото',
      dUpload: (ev) => this.uploadDesign(cat, ev.target.files, ev.target)
    };
  }
  patchDesign(d, patch) {
    const N = window.NEM;
    const upd = (x) => this.setState({ designs: ((this.state || {}).designs || []).map((y) => (y.id === d.id ? { ...y, ...x } : y)) });
    upd(patch);
    N.admin.update('designs', d.id, patch).then(() => this.say(patch.active ? 'Фото снова на сайте' : 'Фото скрыто с сайта')).catch((e) => { upd(d); this.say(e.message); });
  }
  delDesign(d) {
    const N = window.NEM;
    N.admin.remove('designs', d.id).then(() => { this.setState({ designs: ((this.state || {}).designs || []).filter((y) => y.id !== d.id) }); N.admin.removeFile(d.url); this.say('Фото удалено'); }).catch((e) => this.say(e.message));
  }
  uploadDesign(cat, files, input) {
    const N = window.NEM;
    const fl = Array.prototype.slice.call(files || []).slice(0, 10);
    if (!fl.length) return;
    this.setState({ dUp: true });
    const one = (f) => N.resizeImage(f, 1600).then((blob) => {
      const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
      return Promise.all([N.admin.upload(blob, 'designs/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext), window.createImageBitmap ? window.createImageBitmap(blob).then((b) => b.height / b.width).catch(() => 0.75) : Promise.resolve(0.75)]);
    }).then(([url, ratio]) => N.admin.insert('designs', { category: cat, url, ratio: Math.max(0.3, Math.min(3, ratio || 0.75)), sort: -1 }));
    fl.reduce((p, f) => p.then((acc) => one(f).then((row) => acc.concat([row]))), Promise.resolve([]))
      .then((rows) => { this.setState({ dUp: false, designs: rows.concat((this.state || {}).designs || []) }); this.say('Фото добавлено: ' + rows.length); })
      .catch((e) => { this.setState({ dUp: false }); this.say(e.message); })
      .then(() => { if (input) input.value = ''; });
  }
  componentDidMount() {
    const N = window.NEM;
    this.nemOff = N.on(() => this.setState({ nemT: Date.now() }));
    N.load(true);
    if (!N.auth.signedIn()) { this.setState({ auth: 'login' }); return; }
    N.admin.me().then((me) => {
      if (!me) return this.setState({ auth: 'login', err: 'Этот аккаунт не имеет доступа к кабинету' });
      N.admin.list('designs', 'select=*&order=sort.asc,id.asc').then((rows) => this.setState({ designs: rows || [] })).catch(() => this.setState({ designs: [] }));
      return N.admin.list('products', 'select=*&order=sort.asc,name.asc').then((rows) => this.setState({ products: rows, auth: 'app' }));
    }).catch((e) => this.setState({ err: e.message, auth: e.status === 401 ? 'login' : 'app' }));
    this.onLeave = (e) => { if (Object.keys((this.state || {}).edits || {}).length) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', this.onLeave);
  }
  componentWillUnmount() { if (this.nemOff) this.nemOff(); window.removeEventListener('beforeunload', this.onLeave); }
}
</script>
<script>DCLite.mount();</script>
</body>
</html>
