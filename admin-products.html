<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFBF4">
<title>Кабинет — товары и цены</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFBF4;color:#171512;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#171512}a:hover{color:#566B0E}
i.s{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.fld{width:100%;box-sizing:border-box;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid rgba(23,21,18,.16);background:#FFFFFF;font:inherit;font-size:15px;color:#171512;outline:none}
.fld:focus{border-color:#171512}
.num{width:124px;text-align:right;font-variant-numeric:tabular-nums}
.press{transition:transform .15s,background .25s}
.press:active{transform:scale(.97)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
</style>
<style>body{display:flex;justify-content:center;align-items:flex-start;padding-block:24px;background:#E6EDCF}</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAFBF4; font-family: 'Onest', system-ui, sans-serif; color: #171512">
<div class="scroll" style="position: absolute; inset: 0; padding: 18px 16px 130px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 10px">
<a href="admin.html" aria-label="Назад к заказам" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(23,21,18,0.12); background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex-grow: 1"><div style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em">Товары <i class="s" style="font-size: 1.1em">и цены</i></div><div style="font-size: 13px; color: #5E6452">Меняете здесь — сразу меняется на сайте</div></div>
<button type="button" class="press" aria-label="Добавить товар" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #171512; color: #FAFBF4; font-size: 22px; cursor: pointer">+</button>
</div>

<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск товара</label>
<input id="q" class="fld" type="search" placeholder="Поиск: шкаф, комод…">

<div class="hs" role="group" aria-label="Категории">
<sc-for list="{{chips}}" as="item" hint-placeholder-count="5">
<button type="button" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>

<sc-for list="{{rows}}" as="item" hint-placeholder-count="4">
<div style="border-radius: 20px; background: #FFFFFF; border: 1px solid {{item.border}}; overflow: hidden">
<div style="display: flex; gap: 12px; align-items: center; padding: 12px">
<img src="{{item.img}}" alt="" style="width: 56px; height: 70px; border-radius: 12px; object-fit: cover; background: #F1FEC8; flex-shrink: 0">
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 600; font-size: 15px; line-height: 1.25">{{item.name}}</div>
<div style="font-size: 14px; margin-top: 3px">{{item.priceText}}</div>
<span style="display: inline-block; margin-top: 5px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: {{item.stBg}}; color: {{item.stFg}}">{{item.stock}}</span>
</div>
<button type="button" class="press" onClick="{{item.toggleOpen}}" aria-expanded="{{item.expanded}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(23,21,18,0.16); background: transparent; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; color: #171512">{{item.openLabel}}</button>
</div>
<sc-if value="{{item.open}}" hint-placeholder-val="{{false}}">
<div style="padding: 4px 14px 16px; border-top: 1px solid rgba(23,21,18,0.08); display: flex; flex-direction: column; gap: 16px">
<div>
<div style="font-size: 13px; font-weight: 600; margin: 12px 0 8px">Цена по ширине (сборка включена)</div>
<sc-for list="{{item.sizes}}" as="sz" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0">
<label for="{{sz.fid}}" style="font-size: 15px">{{sz.label}}</label>
<div style="display: flex; align-items: center; gap: 6px"><input id="{{sz.fid}}" class="fld num" type="number" inputmode="numeric" step="1000" min="0" value="{{sz.value}}" onChange="{{sz.change}}"><span style="font-size: 14px; color: #5E6452">₸</span></div>
</div>
</sc-for>
<button type="button" style="margin-top: 6px; min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px dashed rgba(23,21,18,0.25); background: transparent; font: inherit; font-size: 13px; color: #525846; cursor: pointer; width: 100%">+ Добавить размер</button>
</div>
<div>
<div style="font-size: 13px; font-weight: 600; margin-bottom: 8px">Цвета</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{item.colors}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px 0 6px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; font: inherit; font-size: 13px; cursor: pointer; color: #171512"><span style="width: 20px; height: 20px; border-radius: 50%; background: {{c.hex}}; box-shadow: inset 0 0 0 1px rgba(23,21,18,0.2)"></span>{{c.name}}</button>
</sc-for>
</div>
</div>
<div>
<div style="font-size: 13px; font-weight: 600; margin-bottom: 8px">Фото</div>
<div style="display: flex; gap: 8px">
<img src="{{item.img}}" alt="Фото 1" style="width: 64px; height: 80px; border-radius: 12px; object-fit: cover; background: #F1FEC8">
<button type="button" aria-label="Добавить фото" style="width: 64px; height: 80px; border-radius: 12px; border: 1px dashed rgba(23,21,18,0.3); background: transparent; color: #525846; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg></button>
</div>
</div>
<button type="button" onClick="{{item.toggleStock}}" aria-pressed="{{item.stockP}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 2px; border: 0; background: transparent; font: inherit; font-size: 15px; cursor: pointer; color: #171512">В наличии (если выкл. — «под заказ»)<span style="position: relative; width: 44px; height: 26px; border-radius: 999px; background: {{item.stTrack}}; flex-shrink: 0; transition: background .25s"><span style="position: absolute; top: 3px; left: {{item.stKnob}}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; transition: left .25s"></span></span></button>
</div>
</sc-if>
</div>
</sc-for>

<div style="border-radius: 20px; background: #FFFFFF; border: 1px solid rgba(23,21,18,0.08); padding: 14px">
<div style="font-weight: 600">Кухни на заказ — цена за метр</div>
<div style="font-size: 13px; color: #5E6452; margin-top: 2px">По этим цифрам сайт считает примерную цену</div>
<sc-for list="{{kitchen}}" as="k" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; margin-top: 4px">
<label for="{{k.fid}}" style="font-size: 15px">{{k.label}}</label>
<div style="display: flex; align-items: center; gap: 6px"><input id="{{k.fid}}" class="fld num" type="number" inputmode="numeric" step="5000" min="0" value="{{k.value}}" onChange="{{k.change}}"><span style="font-size: 14px; color: #5E6452">₸</span></div>
</div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 12px; right: 12px; bottom: 14px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<div class="pop" role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #E3EEDF; color: #2F6B3A; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Сохранено — на сайте уже новые цены</div>
</sc-if>
<button type="button" class="press" onClick="{{save}}" style="min-height: 56px; border-radius: 999px; border: 0; background: {{saveBg}}; color: {{saveFg}}; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer">{{saveLabel}}</button>
</div>
</div>
</template>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>/* Мини-движок страниц New Era Mebel: шаблон + логика компонента → React */
(function () {
  var R = window.React, h = R.createElement;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var RENAME = { 'class': 'className', 'for': 'htmlFor', tabindex: 'tabIndex', readonly: 'readOnly', maxlength: 'maxLength', inputmode: 'inputMode', autocomplete: 'autoComplete', srcset: 'srcSet', crossorigin: 'crossOrigin', viewbox: 'viewBox',
    onclick: 'onClick', onchange: 'onChange', oninput: 'onInput', onsubmit: 'onSubmit', onkeydown: 'onKeyDown', onfocus: 'onFocus', onblur: 'onBlur', onmouseenter: 'onMouseEnter', onmouseleave: 'onMouseLeave' };
  var BOOL = { checked: 1, disabled: 1, multiple: 1, required: 1, selected: 1, autofocus: 1, hidden: 1 };
  var VOID = { input: 1, img: 1, br: 1, hr: 1, meta: 1, link: 1, source: 1, area: 1, col: 1, wbr: 1 };
  var ROOT = null;
  function camel(s) { return s.replace(/-([a-z])/g, function (m, c) { return c.toUpperCase(); }); }
  function propName(n) {
    if (RENAME[n]) return RENAME[n];
    if (n.indexOf('aria-') === 0 || n.indexOf('data-') === 0) return n;
    return n.indexOf('-') >= 0 ? camel(n) : n;
  }
  function lookup(p, scope) {
    p = p.trim();
    if (p === 'true') return true; if (p === 'false') return false; if (p === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(p)) return +p;
    var v = scope, parts = p.split('.');
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    var m = str.match(WHOLE);
    if (m) return lookup(m[1], scope);
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function parseStyle(str) {
    var o = {};
    str.split(';').forEach(function (d) {
      var i = d.indexOf(':'); if (i < 0) return;
      var k = d.slice(0, i).trim(), v = d.slice(i + 1).trim();
      if (!k) return;
      if (k.indexOf('--') !== 0) { k = k.replace(/^-webkit-/, 'Webkit-').replace(/^-ms-/, 'ms-'); k = camel(k); }
      o[k] = v;
    });
    return o;
  }
  function kids(node, scope) {
    var out = [];
    for (var c = node.firstChild, i = 0; c; c = c.nextSibling, i++) {
      var r = build(c, scope, i);
      if (r !== null && r !== undefined && r !== '') out.push(r);
    }
    return out;
  }
  function build(node, scope, key) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      if (!t.trim() && t.indexOf('\n') >= 0) return null;
      if (t.indexOf('{{') < 0) return t;
      var m1 = t.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      return m1 ? lookup(m1[1], scope) : t.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
    }
    if (node.nodeType !== 1) return null;
    var tag = node.localName;
    if (tag === 'helmet') return null;
    if (tag === 'sc-if') {
      return interp(node.getAttribute('value') || '', scope) ? h.apply(null, [R.Fragment, { key: key }].concat(kids(node, scope))) : null;
    }
    if (tag === 'sc-for') {
      var list = interp(node.getAttribute('list') || '', scope) || [], as = node.getAttribute('as') || 'item';
      return h(R.Fragment, { key: key }, list.map(function (it, i) {
        var sc = Object.create(scope); sc[as] = it; sc.$index = i;
        return h.apply(null, [R.Fragment, { key: i }].concat(kids(node, sc)));
      }));
    }
    var props = { key: key };
    for (var j = 0; j < node.attributes.length; j++) {
      var a = node.attributes[j], n = a.name, v = a.value;
      if (n === 'style') { props.style = parseStyle(v.indexOf('{{') >= 0 ? interp(v, scope) : v); continue; }
      var val = v.indexOf('{{') >= 0 ? interp(v, scope) : v;
      if (BOOL[n]) { if (val === '') val = true; else if (val === 'false') val = false; }
      if (n === 'ref') { props.ref = val; continue; }
      props[propName(n)] = val;
    }
    var formy = tag === 'input' || tag === 'select' || tag === 'textarea';
    if (formy && ('value' in props) && !props.onChange && !props.onInput) { props.defaultValue = props.value; delete props.value; }
    if (formy && ('checked' in props) && !props.onChange) { props.defaultChecked = props.checked; delete props.checked; }
    if (VOID[tag] || tag === 'textarea') return h(tag, props);
    return h.apply(null, [tag, props].concat(kids(node, scope)));
  }
  function DCLogic(p) { R.Component.call(this, p); }
  DCLogic.prototype = Object.create(R.Component.prototype);
  DCLogic.prototype.constructor = DCLogic;
  DCLogic.prototype.render = function () {
    var vals = this.renderVals ? this.renderVals() : {};
    return h.apply(null, [R.Fragment, null].concat(kids(ROOT, vals)));
  };
  window.DCLite = {
    mount: function () {
      ROOT = document.getElementById('tpl').content;
      var src = document.getElementById('logic').textContent;
      var Comp = new Function('DCLogic', 'React', src + '\nreturn Component;')(DCLogic, R);
      ReactDOM.createRoot(document.getElementById('root')).render(h(Comp, {}));
    }
  };
})();
</script>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const A = {"nova_walnut": "img/nova_walnut.webp", "nova_white": "img/nova_white.webp", "nova_graphite": "img/nova_graphite.webp", "nova_side": "img/nova_side.webp", "loft": "img/loft.webp", "classic": "img/classic.webp", "skandi": "img/skandi.webp", "port": "img/port.webp", "liniya": "img/liniya.webp", "grid": "img/grid.webp", "flat": "img/flat.webp", "son": "img/son.webp", "student": "img/student.webp", "mini": "img/mini.webp", "shot_island": "img/shot_island.jpg", "shot_column": "img/shot_column.jpg", "shot_dining": "img/shot_dining.jpg", "kitchen_full": "img/kitchen_full.jpg", "kitchen_build": "img/kitchen_build.jpg"};
    const SW = { walnut: { name: 'Орех', hex: '#5A3F2E' }, white: { name: 'Белый', hex: '#F1EEE9' }, graphite: { name: 'Графит', hex: '#3B3B3D' }, oak: { name: 'Дуб', hex: '#C9A57B' }, beige: { name: 'Кашемир', hex: '#D8CDBC' }, sage: { name: 'Шалфей', hex: '#9AA38E' } };
    const base = [
      { id: 'nova', name: 'Шкаф-купе «Нова»', cat: 'Шкафы', img: A.nova_walnut, sizes: { 120: 149000, 140: 167000, 160: 185000, 180: 199000, 200: 219000 }, colors: ['walnut', 'white', 'graphite'], stock: true },
      { id: 'classic', name: 'Шкаф «Классик» 4-дверный', cat: 'Шкафы', img: A.classic, sizes: { 160: 149000 }, colors: ['white', 'beige'], stock: true },
      { id: 'liniya', name: 'Комод «Линия»', cat: 'Комоды', img: A.liniya, sizes: { 80: 64000, 100: 76000 }, colors: ['graphite', 'white', 'oak'], stock: true },
      { id: 'son', name: 'Кровать «Сон»', cat: 'Кровати', img: A.son, sizes: { 140: 125000, 160: 139000, 180: 155000 }, colors: ['walnut', 'oak', 'white'], stock: false },
      { id: 'grid', name: 'Стеллаж «Грид»', cat: 'Стеллажи', img: A.grid, sizes: { 120: 58000 }, colors: ['oak', 'white'], stock: true }
    ];
    const edits = s.edits || {};
    const open = s.open === undefined ? 'nova' : s.open;
    const chip = s.chip || 'Все';
    const dirty = !!s.dirty;
    const fmt = (n) => n.toLocaleString('ru-RU') + ' ₸';
    const upd = (id, patch) => this.setState({ edits: { ...edits, [id]: { ...(edits[id] || {}), ...patch } }, dirty: true, saved: false });
    const list = base.map((p) => ({ ...p, ...(edits[p.id] || {}) })).filter((p) => chip === 'Все' || p.cat === chip);
    const kd = { ldsp: 120000, film: 160000, enamel: 220000, stone: 45000, ...(s.kd || {}) };
    return {
      chips: ['Все', 'Шкафы', 'Комоды', 'Кровати', 'Стеллажи'].map((c) => ({ label: c, pressed: c === chip ? 'true' : 'false', bg: c === chip ? '#171512' : '#FFFFFF', fg: c === chip ? '#FAFBF4' : '#171512', bd: c === chip ? '#171512' : 'rgba(23,21,18,0.14)', pick: () => this.setState({ chip: c }) })),
      rows: list.map((p) => {
        const min = Math.min.apply(null, Object.keys(p.sizes).map((k) => p.sizes[k]));
        const isOpen = open === p.id;
        return {
          id: p.id, name: p.name, img: p.img, priceText: 'от ' + fmt(min),
          stock: p.stock ? 'В наличии' : 'Под заказ', stBg: p.stock ? '#E3EEDF' : '#F6E6D4', stFg: p.stock ? '#2F6B3A' : '#8A4A1C',
          open: isOpen, expanded: isOpen ? 'true' : 'false', openLabel: isOpen ? 'Свернуть' : 'Изменить', border: isOpen ? '#171512' : 'rgba(23,21,18,0.08)',
          toggleOpen: () => this.setState({ open: isOpen ? '' : p.id }),
          sizes: Object.keys(p.sizes).map((k) => ({ fid: 'sz-' + p.id + '-' + k, label: k + ' см', value: p.sizes[k], change: (e) => upd(p.id, { sizes: { ...p.sizes, [k]: Math.max(0, Math.round(Number(e.target.value) || 0)) } }) })),
          colors: Object.keys(SW).map((k) => { const on = p.colors.includes(k); return { name: SW[k].name, hex: SW[k].hex, pressed: on ? 'true' : 'false', bd: on ? '#171512' : 'rgba(23,21,18,0.14)', bg: on ? '#FAFBF4' : '#FFFFFF', toggle: () => upd(p.id, { colors: on ? p.colors.filter((x) => x !== k) : p.colors.concat([k]) }) }; }),
          stockP: p.stock ? 'true' : 'false', stTrack: p.stock ? '#171512' : 'rgba(23,21,18,0.2)', stKnob: p.stock ? '21px' : '3px',
          toggleStock: () => upd(p.id, { stock: !p.stock })
        };
      }),
      kitchen: [['ldsp', 'Фасады ЛДСП, за м'], ['film', 'МДФ плёнка, за м'], ['enamel', 'МДФ эмаль, за м'], ['stone', 'Доплата: камень, за м']].map(([k, label]) => ({ fid: 'kd-' + k, label, value: kd[k], change: (e) => this.setState({ kd: { ...kd, [k]: Math.max(0, Math.round(Number(e.target.value) || 0)) }, dirty: true, saved: false }) })),
      saved: !!s.saved,
      saveLabel: dirty ? 'Сохранить изменения' : 'Всё сохранено',
      saveBg: dirty ? '#171512' : '#E6EDCF', saveFg: dirty ? '#FAFBF4' : '#525846',
      save: () => { if (dirty) this.setState({ dirty: false, saved: true }); }
    };
  }
}
</script>
<script>DCLite.mount();</script>
</body>
</html>
