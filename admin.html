<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFBF4">
<title>Кабинет — заказы и замеры</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFBF4;color:#171512;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#171512}a:hover{color:#566B0E}
i.s{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}
.press{transition:transform .15s,background .25s}
.press:active{transform:scale(.97)}
@keyframes blink{50%{opacity:.3}}
.pulse{animation:blink 1.4s infinite}
</style>
<style>body{display:flex;justify-content:center;align-items:flex-start;padding-block:24px;background:#E6EDCF}</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAFBF4; font-family: 'Onest', system-ui, sans-serif; color: #171512">
<div class="scroll" style="position: absolute; inset: 0; padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: baseline; gap: 5px"><span style="font-weight: 700; font-size: 14px; letter-spacing: 0.02em">NEW ERA</span><i class="s" style="font-size: 17px">кабинет</i></span>
<button type="button" aria-label="Уведомления" style="position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(23,21,18,0.12); background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #171512; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg>
<sc-if value="{{hasNew}}" hint-placeholder-val="{{true}}"><span class="pulse" style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #566B0E"></span></sc-if>
</button>
</div>

<div>
<div style="font-size: 28px; font-weight: 500; letter-spacing: -0.03em">Сәлем, <i class="s" style="font-size: 1.12em">[Имя]</i></div>
<div style="color: #5E6452; font-size: 15px; margin-top: 2px">{{summary}}</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid rgba(23,21,18,0.08)">
<div style="font-size: 12px; color: #5E6452">Неделя</div>
<div style="font-size: 22px; font-weight: 600; margin-top: 6px; letter-spacing: -0.02em">540 000 ₸</div>
<div style="font-size: 12px; color: #5E6452; margin-top: 2px">6 заказов</div>
</div>
<div style="padding: 16px; border-radius: 20px; background: #171512; color: #FAFBF4">
<div style="font-size: 12px; color: #B8BEA6">Месяц</div>
<div style="font-size: 22px; font-weight: 600; margin-top: 6px; letter-spacing: -0.02em">2 180 000 ₸</div>
<div style="font-size: 12px; color: #B8BEA6; margin-top: 2px">23 заказа</div>
</div>
</div>

<sc-if value="{{hasNew}}" hint-placeholder-val="{{true}}">
<div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1.5px solid #566B0E; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #566B0E"><span class="pulse" style="width: 7px; height: 7px; border-radius: 50%; background: #566B0E"></span>НОВЫЙ ЗАКАЗ С САЙТА</span><span style="font-size: 12px; color: #5E6452">3 мин назад</span></div>
<div style="display: flex; gap: 12px">
<img src="img/nova_walnut.webp" alt="" style="width: 60px; height: 74px; border-radius: 12px; object-fit: cover; background: #F1FEC8">
<div><div style="font-weight: 600">Шкаф-купе «Нова» · 160 см</div><div style="font-size: 14px; color: #5E6452; margin-top: 3px">Орех, 1 зеркало · 185 000 ₸</div><div style="font-size: 14px; color: #5E6452; margin-top: 2px">Kaspi · [Адрес клиента]</div></div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" class="press" onClick="{{accept}}" style="flex-grow: 1; min-height: 46px; border-radius: 999px; border: 0; background: #171512; color: #FAFBF4; font: inherit; font-weight: 600; cursor: pointer">Принять</button>
<button type="button" class="press" onClick="{{later}}" style="flex-grow: 1; min-height: 46px; border-radius: 999px; border: 1px solid rgba(23,21,18,0.2); background: transparent; color: #171512; font: inherit; font-weight: 500; cursor: pointer">Позже</button>
</div>
</div>
</sc-if>

<div role="tablist" aria-label="Раздел" style="display: flex; padding: 4px; border-radius: 999px; background: #F1FEC8">
<sc-for list="{{tabs}}" as="item" hint-placeholder-count="2">
<button type="button" role="tab" class="press" onClick="{{item.pick}}" aria-selected="{{item.sel}}" style="flex-grow: 1; min-height: 44px; border-radius: 999px; border: 0; background: {{item.bg}}; color: {{item.fg}}; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>

<sc-for list="{{cards}}" as="item" hint-placeholder-count="3">
<div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid rgba(23,21,18,0.08); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
<div style="display: flex; gap: 12px; min-width: 0">
<div style="width: 52px; flex-shrink: 0; text-align: center; padding: 6px 0; border-radius: 12px; background: #F1FEC8"><div style="font-size: 11px; color: #5E6452">{{item.day}}</div><div style="font-size: 15px; font-weight: 600">{{item.time}}</div></div>
<div style="min-width: 0"><div style="font-weight: 600; line-height: 1.3">{{item.title}}</div><div style="font-size: 13px; color: #5E6452; margin-top: 3px">{{item.sub}}</div><div style="font-size: 13px; color: #5E6452; margin-top: 2px">{{item.client}} · {{item.addr}}</div></div>
</div>
<span style="flex-shrink: 0; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{item.pillBg}}; color: {{item.pillFg}}">{{item.status}}</span>
</div>
<div style="display: flex; gap: 8px">
<a href="tel:+70000000000" aria-label="Позвонить клиенту" style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(23,21,18,0.14); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg></a>
<a href="#" aria-label="Маршрут в 2GIS" style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(23,21,18,0.14); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg></a>
<button type="button" class="press" onClick="{{item.next}}" style="flex-grow: 1; min-height: 46px; border-radius: 999px; border: 1px solid {{item.btnBd}}; background: {{item.btnBg}}; color: {{item.btnFg}}; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">{{item.btn}}</button>
</div>
</div>
</sc-for>
</div>

<nav aria-label="Разделы кабинета" style="position: absolute; left: 12px; right: 12px; bottom: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px; border-radius: 24px; background: rgba(255,255,255,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(23,21,18,0.08); box-shadow: 0 16px 40px -24px rgba(23,21,18,0.5)">
<a href="admin.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; border-radius: 18px; background: #171512; color: #FAFBF4; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg>Заказы</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; border-radius: 18px; color: #525846; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Календарь</a>
<a href="admin-products.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; border-radius: 18px; color: #525846; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V4h8v17M11 21V9h10v12M3 21h18M6 8h2M6 12h2M14 13h4M14 17h4"></path></svg>Товары</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; border-radius: 18px; color: #525846; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"></path></svg>Деньги</a>
</nav>
</div>
</template>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>/* Мини-движок страниц New Era Mebel: шаблон + логика компонента → React */
(function () {
  var R = window.React, h = R.createElement;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var RENAME = { 'class': 'className', 'for': 'htmlFor', tabindex: 'tabIndex', readonly: 'readOnly', maxlength: 'maxLength', inputmode: 'inputMode', autocomplete: 'autoComplete', srcset: 'srcSet', crossorigin: 'crossOrigin', viewbox: 'viewBox',
    onclick: 'onClick', onchange: 'onChange', oninput: 'onInput', onsubmit: 'onSubmit', onkeydown: 'onKeyDown', onfocus: 'onFocus', onblur: 'onBlur', onmouseenter: 'onMouseEnter', onmouseleave: 'onMouseLeave' };
  var BOOL = { checked: 1, disabled: 1, multiple: 1, required: 1, selected: 1, autofocus: 1, hidden: 1 };
  var VOID = { input: 1, img: 1, br: 1, hr: 1, meta: 1, link: 1, source: 1, area: 1, col: 1, wbr: 1 };
  var ROOT = null;
  function camel(s) { return s.replace(/-([a-z])/g, function (m, c) { return c.toUpperCase(); }); }
  function propName(n) {
    if (RENAME[n]) return RENAME[n];
    if (n.indexOf('aria-') === 0 || n.indexOf('data-') === 0) return n;
    return n.indexOf('-') >= 0 ? camel(n) : n;
  }
  function lookup(p, scope) {
    p = p.trim();
    if (p === 'true') return true; if (p === 'false') return false; if (p === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(p)) return +p;
    var v = scope, parts = p.split('.');
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    var m = str.match(WHOLE);
    if (m) return lookup(m[1], scope);
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function parseStyle(str) {
    var o = {};
    str.split(';').forEach(function (d) {
      var i = d.indexOf(':'); if (i < 0) return;
      var k = d.slice(0, i).trim(), v = d.slice(i + 1).trim();
      if (!k) return;
      if (k.indexOf('--') !== 0) { k = k.replace(/^-webkit-/, 'Webkit-').replace(/^-ms-/, 'ms-'); k = camel(k); }
      o[k] = v;
    });
    return o;
  }
  function kids(node, scope) {
    var out = [];
    for (var c = node.firstChild, i = 0; c; c = c.nextSibling, i++) {
      var r = build(c, scope, i);
      if (r !== null && r !== undefined && r !== '') out.push(r);
    }
    return out;
  }
  function build(node, scope, key) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      if (!t.trim() && t.indexOf('\n') >= 0) return null;
      if (t.indexOf('{{') < 0) return t;
      var m1 = t.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      return m1 ? lookup(m1[1], scope) : t.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
    }
    if (node.nodeType !== 1) return null;
    var tag = node.localName;
    if (tag === 'helmet') return null;
    if (tag === 'sc-if') {
      return interp(node.getAttribute('value') || '', scope) ? h.apply(null, [R.Fragment, { key: key }].concat(kids(node, scope))) : null;
    }
    if (tag === 'sc-for') {
      var list = interp(node.getAttribute('list') || '', scope) || [], as = node.getAttribute('as') || 'item';
      return h(R.Fragment, { key: key }, list.map(function (it, i) {
        var sc = Object.create(scope); sc[as] = it; sc.$index = i;
        return h.apply(null, [R.Fragment, { key: i }].concat(kids(node, sc)));
      }));
    }
    var props = { key: key };
    for (var j = 0; j < node.attributes.length; j++) {
      var a = node.attributes[j], n = a.name, v = a.value;
      if (n === 'style') { props.style = parseStyle(v.indexOf('{{') >= 0 ? interp(v, scope) : v); continue; }
      var val = v.indexOf('{{') >= 0 ? interp(v, scope) : v;
      if (BOOL[n]) { if (val === '') val = true; else if (val === 'false') val = false; }
      if (n === 'ref') { props.ref = val; continue; }
      props[propName(n)] = val;
    }
    var formy = tag === 'input' || tag === 'select' || tag === 'textarea';
    if (formy && ('value' in props) && !props.onChange && !props.onInput) { props.defaultValue = props.value; delete props.value; }
    if (formy && ('checked' in props) && !props.onChange) { props.defaultChecked = props.checked; delete props.checked; }
    if (VOID[tag] || tag === 'textarea') return h(tag, props);
    return h.apply(null, [tag, props].concat(kids(node, scope)));
  }
  function DCLogic(p) { R.Component.call(this, p); }
  DCLogic.prototype = Object.create(R.Component.prototype);
  DCLogic.prototype.constructor = DCLogic;
  DCLogic.prototype.render = function () {
    var vals = this.renderVals ? this.renderVals() : {};
    return h.apply(null, [R.Fragment, null].concat(kids(ROOT, vals)));
  };
  window.DCLite = {
    mount: function () {
      ROOT = document.getElementById('tpl').content;
      var src = document.getElementById('logic').textContent;
      var Comp = new Function('DCLogic', 'React', src + '\nreturn Component;')(DCLogic, R);
      ReactDOM.createRoot(document.getElementById('root')).render(h(Comp, {}));
    }
  };
})();
</script>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'orders';
    const st = s.st || {};
    const accepted = !!s.accepted;
    const orders = [
      { id: 'o1', day: 'Сегодня', time: '11:00', title: 'Кухня угловая · 3,2 + 2,4 м', sub: 'МДФ плёнка · 1 480 000 ₸ · аванс внесён', client: 'Айгуль', addr: '[Адрес]', flow: ['Принят', 'Изготовление', 'Доставка', 'Сборка', 'Готово'], at: 1 },
      { id: 'o2', day: 'Сегодня', time: '15:30', title: 'Комод «Линия» + тумба «Мини»', sub: 'Графит · 88 000 ₸ · Kaspi', client: 'Ерлан', addr: '[Адрес]', flow: ['Принят', 'Доставка', 'Сборка', 'Готово'], at: 1 },
      { id: 'o3', day: 'Завтра', time: '10:00', title: 'Шкаф «Классик» 4-дверный', sub: 'Белый · 149 000 ₸ · наличные', client: 'Дина', addr: '[Адрес]', flow: ['Принят', 'Доставка', 'Сборка', 'Готово'], at: 0 }
    ];
    if (accepted) orders.unshift({ id: 'o0', day: 'Завтра', time: '—', title: 'Шкаф-купе «Нова» · 160 см', sub: 'Орех, 1 зеркало · 185 000 ₸ · Kaspi', client: 'Новый клиент', addr: '[Адрес]', flow: ['Принят', 'Доставка', 'Сборка', 'Готово'], at: 0 });
    const measures = [
      { id: 'm1', day: 'Сегодня', time: '17:00', title: 'Замер кухни · угловая', sub: 'Расчёт с сайта: от 1 190 000 до 1 430 000 ₸', client: 'Марат', addr: '[Адрес]', flow: ['Назначен', 'Замер сделан', 'Проект отправлен', 'Договор'], at: 0 },
      { id: 'm2', day: 'Пт', time: '12:00', title: 'Замер · шкаф-купе в нишу', sub: 'Ниша примерно 2,1 × 2,6 м', client: 'Салтанат', addr: '[Адрес]', flow: ['Назначен', 'Замер сделан', 'Проект отправлен', 'Договор'], at: 0 }
    ];
    const src = tab === 'orders' ? orders : measures;
    const cards = src.map((o) => {
      const v = st[o.id] === undefined ? o.at : st[o.id];
      const last = o.flow.length - 1, done = v >= last;
      return {
        ...o, status: o.flow[v],
        pillBg: done ? '#E3EEDF' : v === 0 ? '#F1FEC8' : '#F6E6D4', pillFg: done ? '#2F6B3A' : v === 0 ? '#34382B' : '#8A4A1C',
        btn: done ? 'Завершён ✓' : 'Дальше: ' + o.flow[v + 1],
        btnBg: done ? 'transparent' : '#171512', btnFg: done ? '#2F6B3A' : '#FAFBF4', btnBd: done ? 'rgba(47,107,58,0.35)' : '#171512',
        next: () => { if (!done) this.setState({ st: { ...st, [o.id]: v + 1 } }); }
      };
    });
    return {
      hasNew: !accepted && !s.dismissed,
      accept: () => this.setState({ accepted: true, tab: 'orders' }),
      later: () => this.setState({ dismissed: true }),
      summary: 'Сегодня: 2 доставки и 1 замер',
      tabs: [{ id: 'orders', label: 'Заказы · ' + orders.length }, { id: 'measure', label: 'Замеры · ' + measures.length }].map((t) => ({ ...t, sel: t.id === tab ? 'true' : 'false', bg: t.id === tab ? '#171512' : 'transparent', fg: t.id === tab ? '#FAFBF4' : '#525846', pick: () => this.setState({ tab: t.id }) })),
      cards
    };
  }
}
</script>
<script>DCLite.mount();</script>
</body>
</html>
