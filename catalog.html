<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F1">
<title>Каталог мебели — New Era Mebel</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
:root{--studio:linear-gradient(180deg,#C3CBCF 0%,#B4BEC3 64%,#A6B1B7 64%,#97A3A9 100%);--ink:#1B1F22;--tape:#F3C431;--paper:#F2F3F1}
body{margin:0;background-color:#F2F3F1;background-image:radial-gradient(rgba(27,31,34,.15) 1px,transparent 1.5px);background-size:22px 22px;color:#1B1F22;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,.h1,.h2{font-family:'Unbounded','Onest',system-ui,sans-serif;font-weight:500!important;letter-spacing:-.025em!important}
.logo span{font-family:'Unbounded','Onest',sans-serif;font-weight:600!important;font-size:14px!important;letter-spacing:0!important}
.logo i.s{color:#59626A;font-size:14px!important}
.dk{background-image:radial-gradient(rgba(242,243,241,.11) 1px,transparent 1.5px);background-size:22px 22px}
.dim{position:relative;display:flex;justify-content:center;margin-top:12px;height:13px;border-left:1.5px solid rgba(27,31,34,.5);border-right:1.5px solid rgba(27,31,34,.5)}
.dim::before{content:'';position:absolute;left:0;right:0;top:6px;border-top:1px solid rgba(27,31,34,.4)}
.dim span{position:relative;padding:0 8px;background:#F2F3F1;font-size:11px;line-height:13px;font-weight:600;color:#3E464D;font-variant-numeric:tabular-nums}
a{color:#1B1F22}a:hover{color:#1B1F22}
i.s{font-family:inherit!important;font-style:normal!important;font-size:1em!important;font-weight:inherit;letter-spacing:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;box-sizing:border-box;width:100%}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.hero-split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;align-items:center}
.glass{background:rgba(242,243,241,.74);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.nl{color:#30373D;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px;transition:background .25s,color .25s}
.nl:hover{background:rgba(27,31,34,.06);color:#1B1F22}
.ib{width:44px;height:44px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;color:#1B1F22;cursor:pointer;transition:background .25s}
.ib:hover{background:rgba(27,31,34,.08)}
.btn{display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:0 8px 0 22px;border-radius:999px;background:#1B1F22;color:#F2F3F1;text-decoration:none;font-weight:500;font-size:15px;border:0;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn:hover{color:#FFFFFF;transform:translateY(-2px);box-shadow:0 16px 40px -18px rgba(27,31,34,.8)}
.btn .dot{width:36px;height:36px;border-radius:50%;background:#F3C431;color:#1B1F22;display:inline-flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:hover .dot{transform:rotate(-45deg)}
.btn2{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;border-radius:999px;border:1px solid rgba(27,31,34,.22);color:#1B1F22;text-decoration:none;font-weight:500;font-size:15px;background:transparent;cursor:pointer;transition:background .25s,border-color .25s}
.btn2:hover{background:rgba(27,31,34,.05);border-color:rgba(27,31,34,.5);color:#1B1F22}
.tile{display:block;text-decoration:none;color:#1B1F22}
.tile .ph{overflow:hidden;border-radius:20px;background:var(--studio)}
.tile img{display:block;width:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tile:hover img{transform:scale(1.045)}
.tile:hover{color:#1B1F22}
.tall{position:relative;display:block;border-radius:22px;overflow:hidden;text-decoration:none;color:#F2F3F1;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tall:hover{transform:translateY(-6px);color:#FFFFFF}
.tall img{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.tall:hover img{transform:scale(1.06)}
.fade{transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.bob{animation:bob 1.8s ease-in-out infinite}
.mqw{overflow:hidden;position:relative}
.mq{display:flex;width:max-content;animation:mq 40s linear infinite}
.mq.rev{animation-direction:reverse;animation-duration:70s}
.mqw:hover .mq{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 20s linear infinite}
.cursor{position:fixed;left:0;top:0;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(27,31,34,.5);pointer-events:none;z-index:100;transform:translate3d(-100px,-100px,0);display:none;mix-blend-mode:multiply}
@media (pointer:fine){.cursor{display:block}}
.par{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.hcard{position:relative;flex-shrink:0;border-radius:24px;overflow:hidden;background:var(--studio)}
.pc-name{margin-top:10px;font-size:16px;font-weight:500;text-decoration:none;line-height:1.3}
.pc-size{font-size:13px;color:#59626A;margin-top:4px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pc-price{font-size:20px;font-weight:600;letter-spacing:-.01em}
.pc-btn{min-height:44px;padding:0 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.pc-tag{position:absolute;top:14px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500}
.sh-shade{position:fixed;inset:0;z-index:90;background:rgba(27,31,34,.45);opacity:0;pointer-events:none;transition:opacity .35s}
.sh-shade.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:91;width:min(460px,100%);display:flex;flex-direction:column;background:#F2F3F1;box-shadow:-30px 0 80px -30px rgba(27,31,34,.45);transform:translateX(104%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
.drawer.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s 0s}
.dr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px 14px;border-bottom:1px solid rgba(27,31,34,.08)}
.dr-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 24px}
.dr-foot{padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid rgba(27,31,34,.08);background:#F2F3F1}
.ln{display:grid;grid-template-columns:80px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid rgba(27,31,34,.08)}
.ln img{display:block;width:80px;height:100px;border-radius:14px;object-fit:cover;background:var(--studio)}
.ln-x{width:32px;height:32px;flex-shrink:0;border:0;border-radius:50%;background:transparent;color:#59626A;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ln-x:hover{background:rgba(27,31,34,.06);color:#1B1F22}
.qty{display:inline-flex;align-items:center;border:1px solid rgba(27,31,34,.18);border-radius:999px;padding:2px}
.qty button{width:34px;height:34px;border:0;background:transparent;font:inherit;font-size:18px;cursor:pointer;color:#1B1F22;border-radius:50%}
.qty button:hover{background:rgba(27,31,34,.06)}
.lbl{display:block;font-size:14px;font-weight:600;margin:0 0 6px;padding:0}
.in{width:100%;box-sizing:border-box;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid rgba(27,31,34,.2);background:#FFFFFF;font:inherit;font-size:16px;color:#1B1F22;outline:none;transition:border-color .2s}
.in:focus{border-color:#1B1F22}
textarea.in{padding:12px 16px;min-height:88px;resize:vertical;line-height:1.5}
.pay{display:flex;gap:8px}
.payo{flex:1 1 0;position:relative;cursor:pointer}
.payo input{position:absolute;opacity:0;width:1px;height:1px}
.payo span{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;border:1px solid rgba(27,31,34,.2);background:#FFFFFF;font-weight:500;transition:background .2s,color .2s,border-color .2s}
.payo input:checked+span{background:#1B1F22;color:#F2F3F1;border-color:#1B1F22}
.payo input:focus-visible+span{outline:2px solid #1B1F22;outline-offset:2px}
.err{padding:12px 14px;border-radius:12px;background:#F6E6D4;color:#7A3F14;font-size:14px;line-height:1.45}
.ok-box{padding:12px 14px;border-radius:12px;background:#E3EEDF;color:#2F6B3A;font-size:14px;font-weight:600}
.srch{position:fixed;inset:0;z-index:92;background:#F2F3F1;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.srch.open{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s 0s}
.srch-input{flex:1 1 auto;min-width:0;min-height:64px;border:0;border-bottom:2px solid #1B1F22;background:transparent;font:inherit;font-size:30px;letter-spacing:-.02em;padding:0 2px;outline:none;color:#1B1F22;border-radius:0}
.srch-input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sr-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px;margin-bottom:28px}
.ideas-grid{columns:3 260px;column-gap:14px}
.idea{display:block;position:relative;width:100%;margin:0 0 14px;padding:0;border:0;border-radius:18px;overflow:hidden;background:#DCE1E2;cursor:zoom-in;break-inside:avoid;-webkit-column-break-inside:avoid}
.idea img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.idea:hover img{transform:scale(1.04)}
.idea-cap{position:absolute;left:10px;bottom:10px;padding:5px 10px;border-radius:999px;background:rgba(242,243,241,.92);color:#1B1F22;font-size:12px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.idea:hover .idea-cap,.idea:focus-visible .idea-cap{opacity:1;transform:none}
.ichips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 20px;padding-bottom:2px}
.ichips::-webkit-scrollbar{display:none}
.ichip{flex-shrink:0;min-height:40px;padding:0 15px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.lb{position:fixed;inset:0;z-index:95;display:grid;grid-template-columns:minmax(0,1fr) 360px;background:#121517;color:#F2F3F1;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.lb.open{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s 0s}
.lb-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:24px;touch-action:pan-y}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.lb-nav{position:absolute;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;border:0;background:rgba(242,243,241,.14);color:#F2F3F1;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lb-nav:hover{background:rgba(242,243,241,.26)}
.lb-panel{display:flex;flex-direction:column;gap:14px;padding:28px 26px;background:#1B1F22;overflow-y:auto}
.lb-x{width:46px;height:46px;border-radius:50%;border:0;background:rgba(242,243,241,.1);color:#F2F3F1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lb .fld{width:100%;box-sizing:border-box;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid rgba(242,243,241,.18);background:rgba(242,243,241,.06);font:inherit;font-size:16px;color:#F2F3F1;outline:none}
.lb .fld::placeholder{color:#8D969D}
.lb .fld:focus{border-color:#F3C431}
@media (max-width:860px){.lb{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}.lb-stage{padding:64px 10px 10px}.lb-panel{padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;max-height:52vh}.lb-nav{width:44px;height:44px;margin-top:-22px;font-size:22px}.ideas-grid{columns:2 150px;column-gap:10px}.idea{margin-bottom:10px;border-radius:14px}.idea-cap{opacity:1;transform:none;font-size:11px;padding:4px 8px;left:8px;bottom:8px}}
.toast{position:fixed;left:50%;bottom:22px;z-index:93;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 10px 10px 18px;border-radius:999px;background:#1B1F22;color:#F2F3F1;font-size:14px;box-shadow:0 18px 40px -16px rgba(27,31,34,.6);transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.toast.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:#E4E8E7;color:#1B1F22;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.fav-b{position:absolute;bottom:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(242,243,241,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s;color:#1B1F22}
.fav-b:active{transform:scale(.9)}
.skel{background:linear-gradient(90deg,#E3E7E6 0%,#EEF1F0 50%,#E3E7E6 100%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}
.stars{display:flex;gap:2px}
.stars button{width:40px;height:40px;border:0;background:transparent;cursor:pointer;padding:0;color:#C2C8C9;display:flex;align-items:center;justify-content:center}
.stars button[aria-pressed="true"]{color:#E0A800}
@media (max-width:980px){.g4{gap:24px 12px}.pc-name{font-size:14px;margin-top:8px}.pc-size{font-size:12px}.pc-foot{flex-direction:column;align-items:stretch;gap:8px;margin-top:10px}.pc-price{font-size:17px}.pc-btn{min-height:40px;font-size:13px;padding:0 10px}.pc-tag{top:8px;padding:4px 8px;font-size:11px}.tile .ph{border-radius:16px}}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.two,.hero-split{grid-template-columns:minmax(0,1fr)}.navc{display:none!important}.wrap{padding:0 20px}.h1{font-size:29px!important}.h2{font-size:25px!important}.giant{font-size:20vw!important}}
@media (max-width:560px){.hdr{left:12px!important;right:12px!important;top:12px!important}.hide-s{display:none!important}.h-hint{bottom:132px!important}.h-card{left:16px;right:16px!important;bottom:20px!important;width:auto!important}.logo{padding:11px 16px!important}.srch-input{font-size:22px}.sr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rev-f{grid-template-columns:minmax(0,1fr)!important}}
@media (prefers-reduced-motion:reduce){.bob,.mq,.spin{animation:none}.fade{transition:none}}
</style>
<style>
.cat-layout{display:grid;grid-template-columns:272px minmax(0,1fr);gap:44px;align-items:start}
.chk{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 4px;border-radius:10px;cursor:pointer;font-size:15px;color:#252B30}
.chk input{width:18px;height:18px;accent-color:#1B1F22;margin:0}
.rng{width:100%;accent-color:#1B1F22}
.sel{min-height:44px;padding:0 40px 0 16px;border-radius:999px;border:1px solid rgba(27,31,34,.2);background:#F2F3F1;font:inherit;font-size:14px;color:#1B1F22;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px}
.chip{flex-shrink:0;min-height:44px;padding:0 18px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s}
.filters{position:sticky;top:100px;display:flex;flex-direction:column;gap:28px;padding:24px;border-radius:22px;background:#E4E8E7;border:1px solid rgba(27,31,34,.06)}
.f-head,.f-foot,.f-btn,.f-shade{display:none}
.pills{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:#4E575E}
.pills span{padding:8px 12px;border-radius:999px;background:#E4E8E7;white-space:nowrap}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
@media (max-width:1180px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){
.cat-layout{grid-template-columns:minmax(0,1fr);gap:0}
.chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px 20px;padding:0 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:0 15px}
.filters{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:80;max-height:86vh;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;padding:0 20px 0;gap:24px;background:#F2F3F1;box-shadow:0 -24px 60px -20px rgba(27,31,34,.35);transform:translateY(105%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
.filters.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s 0s}
.f-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2;margin:0 -20px;padding:18px 20px 12px;background:#F2F3F1}
.f-foot{display:flex;gap:10px;position:sticky;bottom:0;margin:0 -20px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:#F2F3F1;border-top:1px solid rgba(27,31,34,.08)}
.f-shade{display:block;position:fixed;inset:0;z-index:79;background:rgba(27,31,34,.42);opacity:0;pointer-events:none;transition:opacity .35s}
.f-shade.open{opacity:1;pointer-events:auto}
.f-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(27,31,34,.22);background:transparent;font:inherit;font-size:14px;font-weight:500;color:#1B1F22;cursor:pointer}
.f-reset-d{display:none!important}
.pills{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px 16px;padding:0 20px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.bar{flex-wrap:nowrap;margin-bottom:18px}
.sel-t{display:none}
.pgrid{gap:26px 12px}
}
</style>

<body>
<div id="root"></div>
<template id="tpl">
<div style="position: relative; width: 100%; min-height: 100vh; background: transparent; overflow-x: clip">
<div ref="{{curRef}}" class="cursor" aria-hidden="true"></div>
<header class="hdr" style="position: fixed; top: 16px; left: 24px; right: 24px; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="index.html" class="glass logo" style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap; padding: 12px 20px; border-radius: 999px; text-decoration: none; color: #1B1F22; border: 1px solid rgba(27,31,34,0.06)">
<span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">NEW ERA</span><i class="s" style="font-size: 19px">mebel</i>
</a>
<nav class="navc glass" aria-label="Главное меню" style="display: flex; gap: 2px; padding: 5px; border-radius: 999px; border: 1px solid rgba(27,31,34,0.06)">
<a class="nl" href="catalog.html">Каталог</a>
<a class="nl" href="kitchen.html">Кухни на заказ</a>
<a class="nl" href="catalog.html#kupe">Шкафы-купе</a>
<a class="nl" href="index.html">Доставка и оплата</a>
<a class="nl" href="index.html">Контакты</a>
</nav>

</a>

<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    if (!this.curRef) this.curRef = { current: null };
    const s = this.state || {};
    const N = window.NEM;
    const all = N.state.products;
    const prods = all || [];
    const favs = N.fav.list();
    const cat = s.cat || 'Все';
    const prices = prods.map((p) => N.minPrice(p));
    const pMaxR = Math.max(300000, Math.ceil((prices.length ? Math.max.apply(null, prices) : 300000) / 50000) * 50000);
    const pMinR = 20000;
    const pmax = s.pmax === undefined ? pMaxR : Math.min(s.pmax, pMaxR);
    const wsel = s.w || {};
    const csel = s.c || {};
    const stockOnly = !!s.stock;
    const sort = s.sort || 'pop';
    const widthDefs = [
      { id: 'w1', label: 'до 100 см', test: (w) => w < 100 },
      { id: 'w2', label: '100–160 см', test: (w) => w >= 100 && w <= 160 },
      { id: 'w3', label: '160–200 см', test: (w) => w > 160 && w <= 200 },
      { id: 'w4', label: 'больше 200 см', test: (w) => w > 200 }
    ];
    const anyW = widthDefs.some((d) => wsel[d.id]);
    const anyC = Object.keys(csel).some((k) => csel[k]);
    let list = prods.filter((p) =>
      (cat === 'Все' || (cat === 'Избранное' ? favs.indexOf(p.id) >= 0 : p.category === cat)) && N.minPrice(p) <= pmax && (!stockOnly || p.in_stock) &&
      (!anyW || widthDefs.some((d) => wsel[d.id] && d.test(p.width_cm || 0))) &&
      (!anyC || (p.colors || []).some((k) => csel[k])));
    if (sort === 'asc') list = list.slice().sort((a, b) => N.minPrice(a) - N.minPrice(b));
    if (sort === 'desc') list = list.slice().sort((a, b) => N.minPrice(b) - N.minPrice(a));
    const catNames = ['Все'].concat(N.CATS, favs.length || cat === 'Избранное' ? ['Избранное'] : []);
    const activeCount = (pmax < pMaxR ? 1 : 0) + widthDefs.filter((d) => wsel[d.id]).length + Object.keys(csel).filter((k) => csel[k]).length + (stockOnly ? 1 : 0);
    const out = {
      fCls: s.fOpen ? 'open' : '', fExp: s.fOpen ? 'true' : 'false',
      openF: () => this.setState({ fOpen: true }), closeF: () => this.setState({ fOpen: false }),
      hasActive: activeCount > 0, activeCount,
      showText: list.length ? 'Показать ' + list.length + ' ' + N.plural(list.length, 'товар', 'товара', 'товаров') : 'Ничего не найдено',
      curRef: this.curRef,
      loading: !all,
      found: all ? list.length : '…', empty: !!all && list.length === 0,
      emptyTitle: cat === 'Избранное' ? 'В избранном пока пусто' : 'Ничего не нашлось',
      emptyText: cat === 'Избранное' ? 'Нажмите на сердечко у товара, чтобы сохранить его здесь.' : 'Попробуйте изменить фильтры — или закажите мебель по своим размерам.',
      cats: catNames.map((n) => ({ name: n === 'Избранное' ? '♥ Избранное · ' + favs.length : n, pressed: n === cat ? 'true' : 'false', bg: n === cat ? '#1B1F22' : 'transparent', fg: n === cat ? '#F2F3F1' : '#1B1F22', bd: n === cat ? '#1B1F22' : 'rgba(27,31,34,0.18)', pick: () => this.pickCat(n) })),
      pmax, pMaxR, pMinR, pMinText: N.fmt(pMinR), pMaxText: N.fmt(pMaxR), maxText: N.fmt(pmax), setMax: (e) => this.setState({ pmax: Number(e.target.value) }),
      widths: widthDefs.map((d) => ({ label: d.label, on: !!wsel[d.id], toggle: () => this.setState({ w: { ...wsel, [d.id]: !wsel[d.id] } }) })),
      colors: Object.keys(N.SW).map((k) => ({ name: N.SW[k].name, hex: N.SW[k].hex, pressed: csel[k] ? 'true' : 'false', ring: csel[k] ? '#1B1F22' : 'transparent', toggle: () => this.setState({ c: { ...csel, [k]: !csel[k] } }) })),
      stockOnly, toggleStock: () => this.setState({ stock: !stockOnly }),
      sort, setSort: (e) => this.setState({ sort: e.target.value }),
      reset: () => this.setState({ pmax: undefined, w: {}, c: {}, stock: false, sort: 'pop' }),
      items: list.map((p, idx) => {
        const on = N.cart.has(p.id), fv = favs.indexOf(p.id) >= 0;
        return {
          id: p.id, name: p.name, img: N.imagesFor(p)[0], size: p.size_text, wText: N.widthText(p), delay: (idx % 3) * 0.07, hasBadge: !!p.badge, badge: p.badge,
          priceText: N.priceFrom(p), swatches: (p.colors || []).map((k) => N.SW[k]).filter(Boolean),
          stockText: N.leadText(p), stockFg: p.in_stock ? '#2F6B3A' : '#59626A',
          btn: on ? 'В корзине ✓' : 'В корзину', addLabel: (on ? 'Открыть корзину: ' : 'В корзину: ') + p.name,
          bg: on ? '#1B1F22' : 'transparent', fg: on ? '#F2F3F1' : '#1B1F22', bd: on ? '#1B1F22' : 'rgba(27,31,34,0.22)',
          add: () => (on ? this.setState({ cartOpen: true, coStep: 'cart' }) : this.quickAdd(p)),
          favToggle: () => N.fav.toggle(p.id), favP: fv ? 'true' : 'false', favFill: fv ? '#F3C431' : 'none', favStroke: '#1B1F22', favLabel: fv ? 'Убрать из избранного' : 'В избранное'
        };
      })
    };
    Object.assign(out, this.shopVals(s));
    const inCat = N.CATS.indexOf(cat) >= 0;
    Object.assign(out, this.ideasVals(s, { cats: inCat ? [cat] : null, chips: !inCat, title: inCat ? cat : 'Идеи', titleI: inCat ? '— идеи и примеры' : 'для вашего дома', step: 12 }));
    return out;
  }
  slugCat(h) {
    const k = (h || '').replace('#', '');
    if (k === 'fav') return 'Избранное';
    const N = window.NEM;
    for (const n in N.CAT_SLUG) if (N.CAT_SLUG[n] === k) return n;
    return 'Все';
  }
  pickCat(n) {
    const N = window.NEM;
    const slug = n === 'Избранное' ? 'fav' : N.CAT_SLUG[n];
    try { history.replaceState(null, '', slug ? '#' + slug : location.pathname + location.search); } catch (e) {}
    this.setState({ cat: n, ideaLim: undefined });
  }
  componentDidMount() {
    this.startFx();
    this.shopMount();
    window.NEM.loadDesigns();
    this.onHash = () => {
      if (location.hash === '#ideas') { this.setState({ cat: 'Все' }); setTimeout(() => { const el = document.getElementById('ideas'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 400); return; }
      if (location.hash === '#search') { this.setState({ cat: 'Все' }); setTimeout(() => { const v = this.shopVals(this.state || {}); v.openSearch(); }, 50); return; }
      this.setState({ cat: this.slugCat(location.hash), ideaLim: undefined });
    };
    if (location.hash) this.onHash();
    window.addEventListener('hashchange', this.onHash);
  }
  componentDidUpdate() { this.shopSync(); }
  componentWillUnmount() { this.stopFx(); this.shopUnmount(); window.removeEventListener('hashchange', this.onHash); }
  // ---- «живые» эффекты: параллакс фото, появление блоков, горизонтальная галерея, наклон карточек, курсор ----
  startFx() {
    this.fxDead = false;
    const mm = (q) => !!(window.matchMedia && window.matchMedia(q).matches);
    const reduce = mm('(prefers-reduced-motion: reduce)');
    const fine = mm('(pointer: fine)');
    let els = { par: [], rv: [], hs: [] }, n = 0;
    const q = () => {
      els = {
        par: Array.prototype.slice.call(document.querySelectorAll('[data-par]')),
        rv: Array.prototype.slice.call(document.querySelectorAll('[data-rv]')),
        hs: Array.prototype.slice.call(document.querySelectorAll('[data-hs]')),
        dk: Array.prototype.slice.call(document.querySelectorAll('.dk'))
      };
    };
    q();
    let cx = -100, cy = -100, tx = -100, ty = -100, big = 0, tbig = 0, tiltEl = null;
    const onMove = (e) => {
      tx = e.clientX; ty = e.clientY;
      const t = e.target && e.target.closest ? e.target : null;
      tbig = t && t.closest('a,button,input,select,label,[data-tilt]') ? 1 : 0;
      const el = t ? t.closest('[data-tilt]') : null;
      if (tiltEl && tiltEl !== el) { tiltEl.style.transform = ''; }
      tiltEl = el;
      if (el && fine && !reduce) {
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
        el.style.transition = 'transform .25s ease-out';
        el.style.transform = 'perspective(900px) rotateX(' + (-y * 7).toFixed(2) + 'deg) rotateY(' + (x * 9).toFixed(2) + 'deg) translateY(-6px)';
      }
    };
    const onOut = (e) => { if (!e.relatedTarget && tiltEl) { tiltEl.style.transform = ''; tiltEl = null; } };
    window.addEventListener('pointermove', onMove, { passive: true });
    document.addEventListener('pointerout', onOut);
    this.fxOff = () => { window.removeEventListener('pointermove', onMove); document.removeEventListener('pointerout', onOut); };
    const loop = () => {
      if (this.fxDead) return;
      if (++n % 45 === 0) q();
      const vh = window.innerHeight || 900, vw = window.innerWidth || 1440;
      // сетка точек «как на чертёжной бумаге» движется вместе с прокруткой, но медленнее страницы
      const sy = window.scrollY || 0;
      if (!reduce && sy !== this.fxSy) {
        this.fxSy = sy;
        document.body.style.backgroundPosition = '0 ' + (-(sy * 0.35) % 22).toFixed(1) + 'px';
        for (let i = 0; i < els.dk.length; i++) els.dk[i].style.backgroundPosition = '0 ' + ((sy * 0.18) % 22).toFixed(1) + 'px';
      }
      if (!reduce) {
        for (let i = 0; i < els.par.length; i++) {
          const el = els.par[i], box = (el.parentElement || el).getBoundingClientRect();
          if (box.bottom < -200 || box.top > vh + 200) continue;
          const sp = parseFloat(el.getAttribute('data-par')) || 0.12;
          const c = (box.top + box.height / 2 - vh / 2) / vh;
          el.style.transform = 'translate3d(0,' + (-c * sp * 100).toFixed(2) + '%,0) scale(' + (1 + sp * 1.6).toFixed(3) + ')';
        }
      }
      for (let i = 0; i < els.rv.length; i++) {
        const el = els.rv[i];
        if (el.__rv === 2) continue;
        const r = el.getBoundingClientRect();
        const inView = r.top < vh * 0.92 && r.bottom > 0;
        if (!el.__rv) {
          el.__rv = 1;
          if (inView || reduce) { el.__rv = 2; continue; }
          el.style.transition = 'none'; el.style.opacity = '0'; el.style.transform = 'translate3d(0,40px,0)';
        } else if (inView) {
          const d = parseFloat(el.getAttribute('data-rv')) || 0;
          el.style.transition = 'opacity 1s cubic-bezier(.2,.8,.2,1) ' + d + 's, transform 1s cubic-bezier(.2,.8,.2,1) ' + d + 's';
          el.style.opacity = '1'; el.style.transform = 'none'; el.__rv = 2;
        }
      }
      for (let i = 0; i < els.hs.length; i++) {
        const sec = els.hs[i], track = sec.querySelector('[data-hs-track]');
        if (!track) continue;
        const r = sec.getBoundingClientRect();
        const p = Math.min(1, Math.max(0, -r.top / Math.max(1, r.height - vh)));
        const dist = Math.max(0, track.scrollWidth - vw + 60);
        track.style.transform = 'translate3d(' + (-p * dist).toFixed(1) + 'px,0,0)';
        const bar = sec.querySelector('[data-hs-bar]');
        if (bar) bar.style.transform = 'scaleX(' + p.toFixed(3) + ')';
      }
      const cur = this.curRef && this.curRef.current;
      if (cur && fine) {
        cx += (tx - cx) * 0.22; cy += (ty - cy) * 0.22; big += (tbig - big) * 0.15;
        cur.style.transform = 'translate3d(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + (1 + big * 1.5).toFixed(3) + ')';
      }
      this.fxRaf = requestAnimationFrame(loop);
    };
    this.fxRaf = requestAnimationFrame(loop);
  }
  stopFx() {
    this.fxDead = true;
    if (this.fxRaf) cancelAnimationFrame(this.fxRaf);
    if (this.fxOff) this.fxOff();
  }
  // ---- общее для страниц магазина: корзина, оформление, поиск ----
  shopVals(s) {
    const N = window.NEM;
    const lines = N.cart.lines();
    const cnt = N.cart.count();
    const step = s.coStep || 'cart';
    const st = N.settings();
    const meV = N.me.get();
    const q = s.q || '';
    const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const prods = N.state.products || [];
    const res = words.length ? prods.filter((p) => { const t = (p.name + ' ' + p.category + ' ' + (p.lead || '')).toLowerCase(); return words.every((w) => t.indexOf(w.slice(0, Math.max(3, w.length - 1))) >= 0); }) : prods.filter((p) => p.badge).concat(prods.filter((p) => !p.badge)).slice(0, 4);
    return {
      hasCart: cnt > 0, cartCount: cnt,
      cartCountText: cnt ? cnt + ' ' + N.plural(cnt, 'товар', 'товара', 'товаров') : '',
      openCart: () => this.setState({ cartOpen: true, searchOpen: false, toastOn: false, coStep: step === 'done' ? 'cart' : step, coErr: '' }),
      closeCart: () => this.setState({ cartOpen: false, coStep: step === 'done' ? 'cart' : step }),
      cartCls: s.cartOpen ? 'open' : '', cartHidden: s.cartOpen ? 'false' : 'true',
      drTitle: step === 'form' ? 'Оформление' : step === 'done' ? 'Спасибо!' : 'Корзина',
      coCart: step === 'cart', coForm: step === 'form', coDone: step === 'done',
      cartEmpty: !lines.length, cartHasItems: lines.length > 0,
      cartLines: lines.map((l) => ({
        ...l, sumText: N.fmt(l.sum), removeLabel: 'Убрать: ' + l.name,
        inc: () => N.cart.setQty(l.key, l.qty + 1),
        dec: () => (l.qty > 1 ? N.cart.setQty(l.key, l.qty - 1) : N.cart.remove(l.key)),
        remove: () => N.cart.remove(l.key)
      })),
      cartTotalText: N.fmt(N.cart.total()),
      showFoot: step !== 'done' && lines.length > 0,
      coNext: () => this.setState({ coStep: 'form', coErr: '' }),
      coBack: () => this.setState({ coStep: 'cart', coErr: '' }),
      meName: meV.name || '', mePhone: meV.phone || '', meAddr: meV.address || '',
      coErr: !!s.coErr, coErrText: s.coErr || '',
      coBusy: !!s.coBusy, coOp: s.coBusy ? 0.6 : 1, coBtn: s.coBusy ? 'Отправляем…' : 'Подтвердить заказ',
      coSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.coSubmit(); },
      doneId: s.doneId || '', doneTotal: N.fmt(s.doneTotal || 0), hasWa: !!N.normPhone(st.whatsapp),
      doneWa: N.waLink(st.whatsapp, 'Здравствуйте! Я оформил(а) заказ №' + (s.doneId || '') + ' на сайте New Era Mebel.'),
      openSearch: () => { this.setState({ searchOpen: true, cartOpen: false }); setTimeout(() => { const el = document.getElementById('srch-q'); if (el) el.focus(); }, 60); },
      closeSearch: () => this.setState({ searchOpen: false }),
      srchCls: s.searchOpen ? 'open' : '', srchHidden: s.searchOpen ? 'false' : 'true',
      q, setQ: (e) => this.setState({ q: e.target.value }),
      srchRes: res.slice(0, 12).map((p) => ({ id: p.id, name: p.name, img: N.imagesFor(p)[0], priceText: (p.sizes && p.sizes.length > 1 ? 'от ' : '') + N.fmt(Math.min.apply(null, [p.price].concat((p.sizes || []).map((z) => z.price)))) })),
      srchNone: words.length > 0 && !res.length,
      srchHint: words.length ? (res.length ? 'Нашли: ' + res.length : 'По запросу «' + q.trim() + '» ничего нет') : 'Популярное сейчас',
      toastCls: s.toastOn ? 'open' : '', toastText: s.toastText || '',
      favCount: N.fav.list().length
    , ...this.lbVals(s) };
  }
  // ---- идеи (фото-примеры) и просмотр на весь экран ----
  ideasVals(s, o) {
    const N = window.NEM;
    const all = N.state.designs || [];
    const cats = ['Кухни'].concat(N.CATS);
    const chipCat = o.chips ? (s.ideaCat || 'Все') : null;
    const want = o.cats || (chipCat && chipCat !== 'Все' ? [chipCat] : null);
    let list = want ? all.filter((d) => want.indexOf(d.category) >= 0) : all;
    if (!want) { // вперемешку по категориям, чтобы было разнообразно
      const by = {}; list.forEach((d) => { (by[d.category] = by[d.category] || []).push(d); });
      const out = []; let more = true;
      for (let i = 0; more; i++) { more = false; cats.forEach((c) => { const x = (by[c] || [])[i]; if (x) { out.push(x); more = true; } }); }
      list = out;
    }
    const lim = s.ideaLim || o.step || 12;
    const shown = list.slice(0, lim);
    const on = (x) => (x ? { bg: '#1B1F22', fg: '#F2F3F1', bd: '#1B1F22' } : { bg: 'transparent', fg: '#1B1F22', bd: 'rgba(27,31,34,0.18)' });
    return {
      ideasCount: list.length, ideasTitle: o.title || 'Идеи', ideasTitleI: o.titleI || 'для вашего дома',
      ideasHasChips: !!o.chips,
      ideasChips: o.chips ? ['Все'].concat(cats).filter((c) => c === 'Все' || all.some((d) => d.category === c)).map((c) => ({ name: c, pressed: c === chipCat ? 'true' : 'false', ...on(c === chipCat), pick: () => this.setState({ ideaCat: c, ideaLim: o.step || 12 }) })) : [],
      ideas: shown.map((d, i) => ({
        src: N.designSrc(d, 500), srcset: N.designSrc(d, 500) + ' 500w, ' + N.designSrc(d, 900) + ' 900w',
        ar: '1 / ' + (Number(d.ratio) || 0.667), cat: d.category, alt: 'Пример дизайна: ' + d.category.toLowerCase(),
        label: 'Открыть фото: ' + d.category.toLowerCase(), open: () => this.openIdea(list, i)
      })),
      ideasMore: list.length > lim, ideasLeft: list.length - lim,
      ideasShowMore: () => this.setState({ ideaLim: lim + (o.step || 12) })
    };
  }
  openIdea(list, i) { this.setState({ lbList: list, lbI: i, lbOpen: true, lbStep: 'ask', lbErr: '', cartOpen: false, searchOpen: false }); }
  lbVals(s) {
    const N = window.NEM;
    const L = s.lbList || [], n = L.length, i = n ? ((s.lbI || 0) % n + n) % n : 0, d = L[i];
    const st = N.settings(), step = s.lbStep || 'ask';
    const go = (k) => this.setState({ lbI: i + k, lbStep: step === 'sent' ? 'ask' : step, lbErr: '' });
    return {
      lbOpen: !!(s.lbOpen && d), lbCls: s.lbOpen && d ? 'open' : '', lbHidden: s.lbOpen && d ? 'false' : 'true',
      lbSrc: d ? N.designSrc(d, 1200) : '', lbSrcset: d ? N.designSrc(d, 900) + ' 900w, ' + N.designSrc(d, 1600) + ' 1600w' : '',
      lbAlt: d ? 'Пример дизайна: ' + d.category.toLowerCase() : '', lbCat: d ? d.category : '', lbCount: n ? (i + 1) + ' из ' + n : '',
      lbPrev: () => go(-1), lbNext: () => go(1), lbClose: () => this.setState({ lbOpen: false }),
      lbAsk: step === 'ask', lbForm: step === 'form', lbSent: step === 'sent', lbId: s.lbId || '',
      lbWant: () => { this.setState({ lbStep: 'form' }); setTimeout(() => { const el = document.getElementById('lb-name'); if (el && !el.value) el.focus(); }, 60); },
      lbHasWa: !!N.normPhone(st.whatsapp), lbWa: d ? N.waLink(st.whatsapp, 'Здравствуйте! Хочу такую мебель (' + d.category.toLowerCase() + '): ' + N.designSrc(d, 1200)) : '',
      lbErr: !!s.lbErr, lbErrText: s.lbErr || '', lbBusy: !!s.lbBusy, lbBtn: s.lbBusy ? 'Отправляем…' : 'Жду звонка',
      lbSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.lbSubmit(d); }
    };
  }
  lbSubmit(d) {
    const N = window.NEM, s = this.state || {};
    if (s.lbBusy || !d) return;
    const v = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
    const name = v('lb-name'), phone = v('lb-phone');
    if (name.trim().length < 2) return this.setState({ lbErr: 'Напишите ваше имя' });
    if (!N.normPhone(phone)) return this.setState({ lbErr: 'Проверьте номер: нужно 10 цифр после +7' });
    this.setState({ lbBusy: true, lbErr: '' });
    N.bookMeasure({ kind: N.designKind(d.category), name, phone, address: '', date: null, time: '', calc: { design: { id: d.id || null, url: N.designSrc(d, 1200), category: d.category } }, comment: 'Хочу как на фото: ' + d.category.toLowerCase() })
      .then((r) => this.setState({ lbBusy: false, lbStep: 'sent', lbId: r.id }))
      .catch((e) => this.setState({ lbBusy: false, lbErr: e.message || 'Не получилось отправить' }));
  }
  coSubmit() {
    const N = window.NEM;
    if ((this.state || {}).coBusy) return;
    const v = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
    const payEl = document.querySelector('input[name="co-pay"]:checked');
    const o = { kind: 'cart', name: v('co-name'), phone: v('co-phone'), address: v('co-addr'), payment: payEl ? payEl.value : 'kaspi', comment: v('co-com') };
    if (o.name.trim().length < 2) return this.setState({ coErr: 'Напишите, как к вам обращаться' });
    if (!N.normPhone(o.phone)) return this.setState({ coErr: 'Проверьте номер телефона: нужно 10 цифр после +7' });
    if (o.address.trim().length < 3) return this.setState({ coErr: 'Укажите адрес доставки' });
    this.setState({ coBusy: true, coErr: '' });
    N.placeOrder(o).then((r) => { N.cart.clear(); this.setState({ coBusy: false, coStep: 'done', doneId: r.id, doneTotal: r.total }); })
      .catch((e) => this.setState({ coBusy: false, coErr: e.message || 'Не получилось отправить заказ' }));
  }
  toast(t) {
    clearTimeout(this.toastT);
    this.setState({ toastText: t, toastOn: true });
    this.toastT = setTimeout(() => this.setState({ toastOn: false }), 3500);
  }
  quickAdd(p) {
    const N = window.NEM;
    N.cart.add({ id: p.id, size: N.defSize(p), color: (p.colors || [])[0] || null, mirror: p.has_mirror ? 'one' : null, qty: 1 });
    this.toast('Добавлено в корзину: ' + p.name);
  }
  shopMount() {
    this.nemOff = window.NEM.on(() => this.setState({ nemT: Date.now() }));
    window.NEM.load();
    this.onEsc = (e) => {
      const st = this.state || {};
      if (st.lbOpen && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !/INPUT|TEXTAREA/.test((e.target || {}).tagName || '')) { this.setState({ lbI: (st.lbI || 0) + (e.key === 'ArrowLeft' ? -1 : 1), lbStep: st.lbStep === 'sent' ? 'ask' : st.lbStep }); return; }
      if (e.key === 'Escape') this.setState({ cartOpen: false, searchOpen: false, fOpen: false, lbOpen: false });
    };
    window.addEventListener('keydown', this.onEsc);
    this.onTs = (e) => { if (e.target.closest && e.target.closest('.lb-stage') && e.touches.length === 1) this.tx = [e.touches[0].clientX, e.touches[0].clientY]; else this.tx = null; };
    this.onTe = (e) => {
      if (!this.tx || !(this.state || {}).lbOpen) return;
      const t = e.changedTouches[0], dx = t.clientX - this.tx[0], dy = t.clientY - this.tx[1]; this.tx = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) this.setState({ lbI: ((this.state || {}).lbI || 0) + (dx < 0 ? 1 : -1) });
      else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5) this.setState({ lbOpen: false });
    };
    window.addEventListener('touchstart', this.onTs, { passive: true });
    window.addEventListener('touchend', this.onTe, { passive: true });
    if (/[?&]cart=1/.test(location.search)) this.setState({ cartOpen: true });
  }
  shopUnmount() {
    if (this.nemOff) this.nemOff();
    window.removeEventListener('keydown', this.onEsc);
    window.removeEventListener('touchstart', this.onTs); window.removeEventListener('touchend', this.onTe);
    clearTimeout(this.toastT);
    document.body.style.overflow = ''; document.body.classList.remove('nem-lock');
  }
  shopSync() {
    const s = this.state || {};
    const lock = !!(s.cartOpen || s.searchOpen || s.fOpen || s.lbOpen);
    document.body.style.overflow = lock ? 'hidden' : '';
    document.body.classList.toggle('nem-lock', lock);
  }
}
</script>
<script>DCLite.mount();</script>
