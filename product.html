<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F1">
<title>Товар — New Era Mebel</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
:root{--studio:linear-gradient(180deg,#C3CBCF 0%,#B4BEC3 64%,#A6B1B7 64%,#97A3A9 100%);--ink:#1B1F22;--tape:#F3C431;--paper:#F2F3F1}
body{margin:0;background-color:#F2F3F1;background-image:radial-gradient(rgba(27,31,34,.15) 1px,transparent 1.5px);background-size:22px 22px;color:#1B1F22;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,.h1,.h2{font-family:'Unbounded','Onest',system-ui,sans-serif;font-weight:500!important;letter-spacing:-.025em!important}
.logo span{font-family:'Unbounded','Onest',sans-serif;font-weight:600!important;font-size:14px!important;letter-spacing:0!important}
.logo i.s{color:#59626A;font-size:14px!important}
.dk{background-image:radial-gradient(rgba(242,243,241,.11) 1px,transparent 1.5px);background-size:22px 22px}
.dim{position:relative;display:flex;justify-content:center;margin-top:12px;height:13px;border-left:1.5px solid rgba(27,31,34,.5);border-right:1.5px solid rgba(27,31,34,.5)}
.dim::before{content:'';position:absolute;left:0;right:0;top:6px;border-top:1px solid rgba(27,31,34,.4)}
.dim span{position:relative;padding:0 8px;background:#F2F3F1;font-size:11px;line-height:13px;font-weight:600;color:#3E464D;font-variant-numeric:tabular-nums}
a{color:#1B1F22}a:hover{color:#1B1F22}
i.s{font-family:inherit!important;font-style:normal!important;font-size:1em!important;font-weight:inherit;letter-spacing:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;box-sizing:border-box;width:100%}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.hero-split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;align-items:center}
.glass{background:rgba(242,243,241,.74);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.nl{color:#30373D;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px;transition:background .25s,color .25s}
.nl:hover{background:rgba(27,31,34,.06);color:#1B1F22}
.ib{width:44px;height:44px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;color:#1B1F22;cursor:pointer;transition:background .25s}
.ib:hover{background:rgba(27,31,34,.08)}
.btn{display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:0 8px 0 22px;border-radius:999px;background:#1B1F22;color:#F2F3F1;text-decoration:none;font-weight:500;font-size:15px;border:0;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn:hover{color:#FFFFFF;transform:translateY(-2px);box-shadow:0 16px 40px -18px rgba(27,31,34,.8)}
.btn .dot{width:36px;height:36px;border-radius:50%;background:#F3C431;color:#1B1F22;display:inline-flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:hover .dot{transform:rotate(-45deg)}
.btn2{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;border-radius:999px;border:1px solid rgba(27,31,34,.22);color:#1B1F22;text-decoration:none;font-weight:500;font-size:15px;background:transparent;cursor:pointer;transition:background .25s,border-color .25s}
.btn2:hover{background:rgba(27,31,34,.05);border-color:rgba(27,31,34,.5);color:#1B1F22}
.tile{display:block;text-decoration:none;color:#1B1F22}
.tile .ph{overflow:hidden;border-radius:20px;background:var(--studio)}
.tile img{display:block;width:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tile:hover img{transform:scale(1.045)}
.tile:hover{color:#1B1F22}
.tall{position:relative;display:block;border-radius:22px;overflow:hidden;text-decoration:none;color:#F2F3F1;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tall:hover{transform:translateY(-6px);color:#FFFFFF}
.tall img{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.tall:hover img{transform:scale(1.06)}
.fade{transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.bob{animation:bob 1.8s ease-in-out infinite}
.mqw{overflow:hidden;position:relative}
.mq{display:flex;width:max-content;animation:mq 40s linear infinite}
.mq.rev{animation-direction:reverse;animation-duration:70s}
.mqw:hover .mq{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 20s linear infinite}
.cursor{position:fixed;left:0;top:0;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(27,31,34,.5);pointer-events:none;z-index:100;transform:translate3d(-100px,-100px,0);display:none;mix-blend-mode:multiply}
@media (pointer:fine){.cursor{display:block}}
.par{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.hcard{position:relative;flex-shrink:0;border-radius:24px;overflow:hidden;background:var(--studio)}
.pc-name{margin-top:10px;font-size:16px;font-weight:500;text-decoration:none;line-height:1.3}
.pc-size{font-size:13px;color:#59626A;margin-top:4px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pc-price{font-size:20px;font-weight:600;letter-spacing:-.01em}
.pc-btn{min-height:44px;padding:0 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.pc-tag{position:absolute;top:14px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500}
.sh-shade{position:fixed;inset:0;z-index:90;background:rgba(27,31,34,.45);opacity:0;pointer-events:none;transition:opacity .35s}
.sh-shade.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:91;width:min(460px,100%);display:flex;flex-direction:column;background:#F2F3F1;box-shadow:-30px 0 80px -30px rgba(27,31,34,.45);transform:translateX(104%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
.drawer.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s 0s}
.dr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px 14px;border-bottom:1px solid rgba(27,31,34,.08)}
.dr-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 24px}
.dr-foot{padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid rgba(27,31,34,.08);background:#F2F3F1}
.ln{display:grid;grid-template-columns:80px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid rgba(27,31,34,.08)}
.ln img{display:block;width:80px;height:100px;border-radius:14px;object-fit:cover;background:var(--studio)}
.ln-x{width:32px;height:32px;flex-shrink:0;border:0;border-radius:50%;background:transparent;color:#59626A;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ln-x:hover{background:rgba(27,31,34,.06);color:#1B1F22}
.qty{display:inline-flex;align-items:center;border:1px solid rgba(27,31,34,.18);border-radius:999px;padding:2px}
.qty button{width:34px;height:34px;border:0;background:transparent;font:inherit;font-size:18px;cursor:pointer;color:#1B1F22;border-radius:50%}
.qty button:hover{background:rgba(27,31,34,.06)}
.lbl{display:block;font-size:14px;font-weight:600;margin:0 0 6px;padding:0}
.in{width:100%;box-sizing:border-box;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid rgba(27,31,34,.2);background:#FFFFFF;font:inherit;font-size:16px;color:#1B1F22;outline:none;transition:border-color .2s}
.in:focus{border-color:#1B1F22}
textarea.in{padding:12px 16px;min-height:88px;resize:vertical;line-height:1.5}
.pay{display:flex;gap:8px}
.payo{flex:1 1 0;position:relative;cursor:pointer}
.payo input{position:absolute;opacity:0;width:1px;height:1px}
.payo span{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;border:1px solid rgba(27,31,34,.2);background:#FFFFFF;font-weight:500;transition:background .2s,color .2s,border-color .2s}
.payo input:checked+span{background:#1B1F22;color:#F2F3F1;border-color:#1B1F22}
.payo input:focus-visible+span{outline:2px solid #1B1F22;outline-offset:2px}
.err{padding:12px 14px;border-radius:12px;background:#F6E6D4;color:#7A3F14;font-size:14px;line-height:1.45}
.ok-box{padding:12px 14px;border-radius:12px;background:#E3EEDF;color:#2F6B3A;font-size:14px;font-weight:600}
.srch{position:fixed;inset:0;z-index:92;background:#F2F3F1;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.srch.open{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s 0s}
.srch-input{flex:1 1 auto;min-width:0;min-height:64px;border:0;border-bottom:2px solid #1B1F22;background:transparent;font:inherit;font-size:30px;letter-spacing:-.02em;padding:0 2px;outline:none;color:#1B1F22;border-radius:0}
.srch-input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sr-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px;margin-bottom:28px}
.toast{position:fixed;left:50%;bottom:22px;z-index:93;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 10px 10px 18px;border-radius:999px;background:#1B1F22;color:#F2F3F1;font-size:14px;box-shadow:0 18px 40px -16px rgba(27,31,34,.6);transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.toast.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:#E4E8E7;color:#1B1F22;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.fav-b{position:absolute;bottom:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(242,243,241,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s;color:#1B1F22}
.fav-b:active{transform:scale(.9)}
.skel{background:linear-gradient(90deg,#E3E7E6 0%,#EEF1F0 50%,#E3E7E6 100%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}
.stars{display:flex;gap:2px}
.stars button{width:40px;height:40px;border:0;background:transparent;cursor:pointer;padding:0;color:#C2C8C9;display:flex;align-items:center;justify-content:center}
.stars button[aria-pressed="true"]{color:#E0A800}
@media (max-width:980px){.g4{gap:24px 12px}.pc-name{font-size:14px;margin-top:8px}.pc-size{font-size:12px}.pc-foot{flex-direction:column;align-items:stretch;gap:8px;margin-top:10px}.pc-price{font-size:17px}.pc-btn{min-height:40px;font-size:13px;padding:0 10px}.pc-tag{top:8px;padding:4px 8px;font-size:11px}.tile .ph{border-radius:16px}}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.two,.hero-split{grid-template-columns:minmax(0,1fr)}.navc{display:none!important}.wrap{padding:0 20px}.h1{font-size:29px!important}.h2{font-size:25px!important}.giant{font-size:20vw!important}}
@media (max-width:560px){.hdr{left:12px!important;right:12px!important;top:12px!important}.hide-s{display:none!important}.h-hint{bottom:132px!important}.h-card{left:16px;right:16px!important;bottom:20px!important;width:auto!important}.logo{padding:11px 16px!important}.srch-input{font-size:22px}.sr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rev-f{grid-template-columns:minmax(0,1fr)!important}}
@media (prefers-reduced-motion:reduce){.bob,.mq,.spin{animation:none}.fade{transition:none}}
</style>
<style>
.pp{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;align-items:start}
.opt{min-height:48px;padding:0 16px;border-radius:14px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.thumb{width:84px;height:104px;border-radius:14px;overflow:hidden;padding:0;cursor:pointer;background:var(--studio)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fld{width:100%;box-sizing:border-box;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid rgba(27,31,34,.2);background:#FFFFFF;font:inherit;font-size:16px;color:#1B1F22;outline:none}
.fld:focus{border-color:#1B1F22}
@media (max-width:980px){.pp{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.gal{flex-direction:column-reverse}.gal-t{flex-direction:row!important;overflow-x:auto}.thumb{width:64px;height:80px;flex-shrink:0}}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="position: relative; width: 100%; min-height: 100vh; background: transparent; overflow-x: clip">
<div ref="{{curRef}}" class="cursor" aria-hidden="true"></div>
<header class="hdr" style="position: fixed; top: 16px; left: 24px; right: 24px; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="index.html" class="glass logo" style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap; padding: 12px 20px; border-radius: 999px; text-decoration: none; color: #1B1F22; border: 1px solid rgba(27,31,34,0.06)">
<span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">NEW ERA</span><i class="s" style="font-size: 19px">mebel</i>
</a>
<nav class="navc glass" aria-label="Главное меню" style="display: flex; gap: 2px; padding: 5px; border-radius: 999px; border: 1px solid rgba(27,31,34,0.06)">
<a class="nl" href="catalog.html">Каталог</a>
<a class="nl" href="kitchen.html">Кухни на заказ</a>
<a class="nl" href="catalog.html#kupe">Шкафы-купе</a>
<a class="nl" href="index.html">Доставка и оплата</a>
<a class="nl" href="index.html">Контакты</a>
</nav>
<div class="glass" style="display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; border: 1px solid rgba(27,31,34,0.06)">
<button type="button" class="ib hide-s" aria-label="Поиск" onClick="{{openSearch}}" style="background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg></button>
<a class="ib hide-s" href="catalog.html#fav" aria-label="Избранное" style="background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></a>
<button type="button" class="ib" aria-label="Корзина" onClick="{{openCart}}" style="position: relative; background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<sc-if value="{{hasCart}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #1B1F22; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{cartCount}}</span></sc-if>
</button>
<a class="btn" href="kitchen.html" style="min-height: 44px; font-size: 14px; padding-left: 18px; padding-right: 5px; gap: 10px; white-space: nowrap"><span>Замер<span class="hide-s"> бесплатно</span></span><span class="dot" style="width: 34px; height: 34px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</div>
</header>
<main class="wrap" style="padding-top: 110px; padding-bottom: 100px">
<sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
<div class="pp" aria-busy="true"><div class="skel" style="aspect-ratio: 4 / 5"></div><div style="display: flex; flex-direction: column; gap: 16px"><div class="skel" style="height: 48px; width: 80%"></div><div class="skel" style="height: 80px"></div><div class="skel" style="height: 52px; width: 50%"></div><div class="skel" style="height: 120px"></div></div></div>
</sc-if>
<sc-if value="{{missing}}" hint-placeholder-val="{{false}}">
<div style="padding: 80px 0; text-align: center"><h1 style="margin: 0; font-size: 32px; font-weight: 500; letter-spacing: -0.03em">Такого товара <i class="s" style="font-size: 1.1em">больше нет</i></h1><p style="color: #59626A; margin: 14px 0 28px">Возможно, его убрали из каталога. Посмотрите похожие модели.</p><a class="btn" href="catalog.html">Открыть каталог<span class="dot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a></div>
</sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{true}}">
<nav aria-label="Навигация" style="display: flex; gap: 8px; font-size: 14px; color: #59626A; margin-bottom: 24px"><a href="index.html" style="color: #59626A; text-decoration: none">Главная</a><span aria-hidden="true">/</span><a href="catalog.html#{{catSlug}}" style="color: #59626A; text-decoration: none">{{catName}}</a><span aria-hidden="true">/</span><span style="color: #1B1F22">{{quote}}</span></nav>

<div class="pp">
<div class="gal" style="display: flex; gap: 16px">
<div role="group" aria-label="Фото" class="gal-t" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{thumbs}}" as="item" hint-placeholder-count="2">
<button type="button" class="thumb" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" aria-label="{{item.label}}" style="border: 2px solid {{item.ring}}"><img src="{{item.src}}" alt=""></button>
</sc-for>
</div>
<div style="position: relative; flex-grow: 1; border-radius: 26px; overflow: hidden; background: var(--studio); aspect-ratio: 4 / 5">
<img src="{{mainImg}}" alt="{{mainAlt}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: absolute; top: 18px; left: 18px; display: flex; gap: 6px"><sc-if value="{{hasBadge}}" hint-placeholder-val="{{true}}"><span style="padding: 6px 12px; border-radius: 999px; background: #1B1F22; color: #F2F3F1; font-size: 12px; font-weight: 500">{{badge}}</span></sc-if><span style="padding: 6px 12px; border-radius: 999px; background: rgba(242,243,241,0.9); color: {{stockFg}}; font-size: 12px; font-weight: 500">{{stockText}}</span></div>
<button type="button" onClick="{{toggleFav}}" aria-pressed="{{favP}}" aria-label="В избранное" style="position: absolute; top: 14px; right: 14px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(242,243,241,0.9); color: {{favColor}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
</div>
</div>

<div style="position: sticky; top: 100px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 500">{{titleMain}} <i class="s" style="font-size: 1.12em">{{quote}}</i></h1>
<p style="margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4E575E">{{lead}}</p>

<div style="display: flex; align-items: baseline; gap: 12px; margin-top: 26px">
<div style="font-size: 38px; font-weight: 600; letter-spacing: -0.02em">{{priceText}}</div>
<div style="font-size: 14px; color: #59626A">сборка включена</div>
</div>

<div style="margin-top: 28px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px"><span style="font-weight: 600">{{sizeLabel}}</span><span style="color: #59626A">{{dims}}</span></div>
<sc-if value="{{multiSize}}" hint-placeholder-val="{{true}}">
<div role="group" aria-label="{{sizeLabel}}" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">

</ul>
