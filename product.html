<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шкаф-купе «Нова» — New Era Mebel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#F6F4EF;color:#171512;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#171512}a:hover{color:#A6521F}
i.s{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;letter-spacing:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;box-sizing:border-box;width:100%}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.hero-split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;align-items:center}
.glass{background:rgba(246,244,239,.74);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.nl{color:#3B3630;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px;transition:background .25s,color .25s}
.nl:hover{background:rgba(23,21,18,.06);color:#171512}
.ib{width:44px;height:44px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;color:#171512;cursor:pointer;transition:background .25s}
.ib:hover{background:rgba(23,21,18,.08)}
.btn{display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:0 8px 0 22px;border-radius:999px;background:#171512;color:#F6F4EF;text-decoration:none;font-weight:500;font-size:15px;border:0;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn:hover{color:#FFFFFF;transform:translateY(-2px);box-shadow:0 16px 40px -18px rgba(23,21,18,.8)}
.btn .dot{width:36px;height:36px;border-radius:50%;background:#F6F4EF;color:#171512;display:inline-flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:hover .dot{transform:rotate(-45deg)}
.btn2{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;border-radius:999px;border:1px solid rgba(23,21,18,.22);color:#171512;text-decoration:none;font-weight:500;font-size:15px;background:transparent;cursor:pointer;transition:background .25s,border-color .25s}
.btn2:hover{background:rgba(23,21,18,.05);border-color:rgba(23,21,18,.5);color:#171512}
.tile{display:block;text-decoration:none;color:#171512}
.tile .ph{overflow:hidden;border-radius:20px;background:#EEEBE4}
.tile img{display:block;width:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tile:hover img{transform:scale(1.045)}
.tile:hover{color:#171512}
.tall{position:relative;display:block;border-radius:22px;overflow:hidden;text-decoration:none;color:#F6F4EF;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tall:hover{transform:translateY(-6px);color:#FFFFFF}
.tall img{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.tall:hover img{transform:scale(1.06)}
.fade{transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.bob{animation:bob 1.8s ease-in-out infinite}
.mqw{overflow:hidden;position:relative}
.mq{display:flex;width:max-content;animation:mq 40s linear infinite}
.mq.rev{animation-direction:reverse;animation-duration:70s}
.mqw:hover .mq{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 20s linear infinite}
.cursor{position:fixed;left:0;top:0;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(23,21,18,.5);pointer-events:none;z-index:100;transform:translate3d(-100px,-100px,0);display:none;mix-blend-mode:multiply}
@media (pointer:fine){.cursor{display:block}}
.par{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.hcard{position:relative;flex-shrink:0;border-radius:24px;overflow:hidden;background:#E6E1D9}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.two,.hero-split{grid-template-columns:minmax(0,1fr)}.navc{display:none!important}.wrap{padding:0 20px}.h1{font-size:40px!important}.h2{font-size:34px!important}.giant{font-size:26vw!important}}
@media (prefers-reduced-motion:reduce){.bob,.mq,.spin{animation:none}.fade{transition:none}}
</style>
<style>
.pp{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;align-items:start}
.opt{min-height:48px;padding:0 16px;border-radius:14px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.thumb{width:84px;height:104px;border-radius:14px;overflow:hidden;padding:0;cursor:pointer;background:#EEEBE4}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fld{width:100%;box-sizing:border-box;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid rgba(23,21,18,.2);background:#FFFFFF;font:inherit;font-size:15px;color:#171512;outline:none}
.fld:focus{border-color:#171512}
@media (max-width:980px){.pp{grid-template-columns:minmax(0,1fr)}}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="position: relative; width: 100%; min-height: 100vh; background: #F6F4EF; overflow-x: clip">
<div ref="{{curRef}}" class="cursor" aria-hidden="true"></div>
<header style="position: fixed; top: 16px; left: 24px; right: 24px; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="index.html" class="glass" style="display: flex; align-items: baseline; gap: 6px; padding: 12px 20px; border-radius: 999px; text-decoration: none; color: #171512; border: 1px solid rgba(23,21,18,0.06)">
<span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">NEW ERA</span><i class="s" style="font-size: 19px">mebel</i>
</a>
<nav class="navc glass" aria-label="Главное меню" style="display: flex; gap: 2px; padding: 5px; border-radius: 999px; border: 1px solid rgba(23,21,18,0.06)">
<a class="nl" href="catalog.html">Каталог</a>
<a class="nl" href="kitchen.html">Кухни на заказ</a>
<a class="nl" href="catalog.html">Шкафы-купе</a>
<a class="nl" href="index.html">Доставка и оплата</a>
<a class="nl" href="index.html">Контакты</a>
</nav>
<div class="glass" style="display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; border: 1px solid rgba(23,21,18,0.06)">
<button type="button" class="ib" aria-label="Поиск" style="background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg></button>
<button type="button" class="ib" aria-label="Избранное" style="background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
<button type="button" class="ib" aria-label="Корзина" style="position: relative; background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<sc-if value="{{hasCart}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #A6521F; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{cartCount}}</span></sc-if>
</button>
<a class="btn" href="kitchen.html" style="min-height: 44px; font-size: 14px; padding-left: 18px; padding-right: 5px; gap: 10px">Замер бесплатно<span class="dot" style="width: 34px; height: 34px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</div>
</header>
<main class="wrap" style="padding-top: 110px; padding-bottom: 100px">
<nav aria-label="Навигация" style="display: flex; gap: 8px; font-size: 14px; color: #6B645A; margin-bottom: 24px"><a href="index.html" style="color: #6B645A; text-decoration: none">Главная</a><span aria-hidden="true">/</span><a href="catalog.html" style="color: #6B645A; text-decoration: none">Шкафы-купе</a><span aria-hidden="true">/</span><span style="color: #171512">«Нова»</span></nav>

<div class="pp">
<div style="display: flex; gap: 16px">
<div role="group" aria-label="Фото" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{thumbs}}" as="item" hint-placeholder-count="2">
<button type="button" class="thumb" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" aria-label="{{item.label}}" style="border: 2px solid {{item.ring}}"><img src="{{item.src}}" alt=""></button>
</sc-for>
</div>
<div style="position: relative; flex-grow: 1; border-radius: 26px; overflow: hidden; background: #EEEBE4; aspect-ratio: 4 / 5">
<img src="{{mainImg}}" alt="{{mainAlt}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: absolute; top: 18px; left: 18px; display: flex; gap: 6px"><span style="padding: 6px 12px; border-radius: 999px; background: #171512; color: #F6F4EF; font-size: 12px; font-weight: 500">Хит</span><span style="padding: 6px 12px; border-radius: 999px; background: rgba(246,244,239,0.9); color: #2F6B3A; font-size: 12px; font-weight: 500">В наличии</span></div>
<button type="button" onClick="{{toggleFav}}" aria-pressed="{{favP}}" aria-label="В избранное" style="position: absolute; top: 14px; right: 14px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(246,244,239,0.9); color: {{favColor}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
</div>
</div>

<div style="position: sticky; top: 100px">
<h1 style="margin: 0; font-size: 40px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 500">Шкаф-купе <i class="s" style="font-size: 1.12em">«Нова»</i></h1>
<p style="margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #5A544B">Двухдверный шкаф-купе с зеркалом. Бесшумные роликовые механизмы, алюминиевый профиль, внутри — штанга и полки.</p>

<div style="display: flex; align-items: baseline; gap: 12px; margin-top: 26px">
<div style="font-size: 38px; font-weight: 600; letter-spacing: -0.02em">{{priceText}}</div>
<div style="font-size: 14px; color: #6B645A">сборка включена</div>
</div>

<div style="margin-top: 28px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">Ширина</span><span style="color: #6B645A">высота 220 · глубина 60 см</span></div>
<div role="group" aria-label="Ширина" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 10px">
<sc-for list="{{widths}}" as="item" hint-placeholder-count="5">
<button type="button" class="opt" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; padding: 0 6px">{{item.label}}</button>
</sc-for>
</div>
</div>

<div style="margin-top: 22px">
<div style="font-size: 14px"><span style="font-weight: 600">Цвет:</span> <span style="color: #5A544B">{{colorName}}</span></div>
<div role="group" aria-label="Цвет" style="display: flex; gap: 10px; margin-top: 10px">
<sc-for list="{{colors}}" as="item" hint-placeholder-count="3">
<button type="button" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" aria-label="{{item.name}}" title="{{item.name}}" style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid {{item.ring}}; background: transparent; padding: 4px; cursor: pointer"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: {{item.hex}}; box-shadow: inset 0 0 0 1px rgba(23,21,18,0.18)"></span></button>
</sc-for>
</div>
</div>

<div style="margin-top: 22px">
<div style="font-size: 14px; font-weight: 600">Зеркало</div>
<div role="group" aria-label="Зеркало" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px">
<sc-for list="{{mirrors}}" as="item" hint-placeholder-count="3">
<button type="button" class="opt" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font-size: 14px">{{item.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 10px; margin-top: 28px">
<div style="display: flex; align-items: center; border: 1px solid rgba(23,21,18,0.2); border-radius: 999px; padding: 4px">
<button type="button" onClick="{{qtyDown}}" aria-label="Меньше" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #171512">−</button>
<span style="min-width: 28px; text-align: center; font-weight: 600">{{qty}}</span>
<button type="button" onClick="{{qtyUp}}" aria-label="Больше" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #171512">+</button>
</div>
<button type="button" class="btn" onClick="{{addCart}}" style="flex-grow: 1; justify-content: space-between; min-height: 56px">{{cartBtn}}<span class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg></span></button>
</div>
<button type="button" class="btn2" onClick="{{openQuick}}" style="width: 100%; justify-content: center; margin-top: 10px; min-height: 52px">Купить в 1 клик</button>

<sc-if value="{{quick}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 12px; padding: 18px; border-radius: 18px; background: #EEEBE4">
<sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
<label for="q1" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px">Ваш телефон — перезвоним и оформим</label>
<div style="display: flex; gap: 8px"><input id="q1" class="fld" type="tel" placeholder="+7 ___ ___ __ __"><button type="button" class="btn" onClick="{{sendQuick}}" style="padding: 0 22px; min-height: 50px">Жду звонка</button></div>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}"><div role="status" style="font-weight: 600; color: #2F6B3A">Заявка принята! Перезвоним в течение [N] минут.</div></sc-if>
</div>
</sc-if>

<ul style="list-style: none; margin: 26px 0 0; padding: 0; border-top: 1px solid rgba(23,21,18,0.1)">
<li style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(23,21,18,0.1); font-size: 15px"><span style="color: #6B645A">Сборка</span><span style="font-weight: 500">Включена в цену</span></li>
<li style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(23,21,18,0.1); font-size: 15px"><span style="color: #6B645A">Доставка по Туркестану</span><span style="font-weight: 500">Бесплатно</span></li>
<li style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(23,21,18,0.1); font-size: 15px"><span style="color: #6B645A">Оплата</span><span style="font-weight: 500">Kaspi или наличные</span></li>
<li style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(23,21,18,0.1); font-size: 15px"><span style="color: #6B645A">Гарантия</span><span style="font-weight: 500">[срок]</span></li>
</ul>
<a href="kitchen.html" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 18px; padding: 18px 20px; border-radius: 18px; background: #EEEBE4; text-decoration: none">
<span><span style="display: block; font-weight: 600">Нужен другой размер?</span><span style="display: block; font-size: 14px; color: #6B645A; margin-top: 3px">Сделаем «Нову» под вашу нишу — замер бесплатный</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</div>
</div>

<section data-rv="0" style="margin-top: 90px">
<div role="tablist" aria-label="О товаре" style="display: flex; gap: 6px; border-bottom: 1px solid rgba(23,21,18,0.12)">
<sc-for list="{{tabs}}" as="item" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{item.sel}}" onClick="{{item.pick}}" style="min-height: 52px; padding: 0 20px; border: 0; border-bottom: 2px solid {{item.line}}; background: transparent; font: inherit; font-size: 16px; font-weight: 500; color: {{item.fg}}; cursor: pointer; margin-bottom: -1px">{{item.label}}</button>
</sc-for>
</div>
<div role="tabpanel" style="padding: 32px 0; max-width: 820px">
<sc-if value="{{tab0}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3B3630">«Нова» — вместительный шкаф-купе для спальни или прихожей. Двери двигаются плавно и тихо, зеркало визуально расширяет комнату. Внутри: две секции, штанга для одежды на всю ширину отсека и регулируемые полки. Корпус из ЛДСП 16 мм с кромкой ПВХ.</p>
</sc-if>
<sc-if value="{{tab1}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column">
<sc-for list="{{specs}}" as="item" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 13px 0; border-bottom: 1px solid rgba(23,21,18,0.1)"><span style="color: #6B645A">{{item.k}}</span><span style="font-weight: 500">{{item.v}}</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{tab2}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3B3630">По Туркестану привозим бесплатно в удобный день. Мастер соберёт и установит шкаф — это уже входит в цену. Доставка за город — по договорённости. Оплата при получении: Kaspi или наличными.</p>
</sc-if>
</div>
</section>

<section style="margin-top: 40px">
<h2 style="margin: 0 0 28px; font-size: 34px; letter-spacing: -0.03em; font-weight: 500">С этим <i class="s" style="font-size: 1.1em">смотрят</i></h2>
<div class="g4">
<sc-for list="{{related}}" as="item" hint-placeholder-count="4">
<a class="tile" href="product.html" data-rv="{{item.delay}}">
<div class="ph" style="aspect-ratio: 4 / 5"><img src="{{item.img}}" alt="{{item.name}}" style="height: 100%; object-fit: cover"></div>
<div style="margin-top: 12px; font-weight: 500">{{item.name}}</div>
<div style="margin-top: 6px; font-size: 18px; font-weight: 600">{{item.priceText}}</div>
</a>
</sc-for>
</div>
</section>
</main>
</div>
</template>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>/* Мини-движок страниц New Era Mebel: шаблон + логика компонента → React */

  var R = window.React, h = R.createElement;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var RENAME = { 'class': 'className', 'for': 'htmlFor', tabindex: 'tabIndex', readonly: 'readOnly', maxlength: 'maxLength', inputmode: 'inputMode', autocomplete: 'autoComplete', srcset: 'srcSet', crossorigin: 'crossOrigin', viewbox: 'viewBox',
    onclick: 'onClick', onchange: 'onChange', oninput: 'onInput', onsubmit: 'onSubmit', onkeydown: 'onKeyDown', onfocus: 'onFocus', onblur: 'onBlur', onmouseenter: 'onMouseEnter', onmouseleave: 'onMouseLeave' };
  var BOOL = { checked: 1, disabled: 1, multiple: 1, required: 1, selected: 1, autofocus: 1, hidden: 1 };
  var VOID = { input: 1, img: 1, br: 1, hr: 1, meta: 1, link: 1, source: 1, area: 1, col: 1, wbr: 1 };
  var ROOT = null;
