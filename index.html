<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFBF4">
<meta name="description" content="New Era Mebel — мебель на заказ и в наличии в Туркестане. Кухни, шкафы-купе, корпусная мебель. Сборка входит в цену, доставка по городу бесплатно.">
<title>New Era Mebel — мебель на заказ, Туркестан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FAFBF4;color:#171512;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#171512}a:hover{color:#566B0E}
i.s{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;letter-spacing:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;box-sizing:border-box;width:100%}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.hero-split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;align-items:center}
.glass{background:rgba(250,251,244,.74);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.nl{color:#34382B;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px;transition:background .25s,color .25s}
.nl:hover{background:rgba(23,21,18,.06);color:#171512}
.ib{width:44px;height:44px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;color:#171512;cursor:pointer;transition:background .25s}
.ib:hover{background:rgba(23,21,18,.08)}
.btn{display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:0 8px 0 22px;border-radius:999px;background:#171512;color:#FAFBF4;text-decoration:none;font-weight:500;font-size:15px;border:0;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn:hover{color:#FFFFFF;transform:translateY(-2px);box-shadow:0 16px 40px -18px rgba(23,21,18,.8)}
.btn .dot{width:36px;height:36px;border-radius:50%;background:#FAFBF4;color:#171512;display:inline-flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:hover .dot{transform:rotate(-45deg)}
.btn2{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;border-radius:999px;border:1px solid rgba(23,21,18,.22);color:#171512;text-decoration:none;font-weight:500;font-size:15px;background:transparent;cursor:pointer;transition:background .25s,border-color .25s}
.btn2:hover{background:rgba(23,21,18,.05);border-color:rgba(23,21,18,.5);color:#171512}
.tile{display:block;text-decoration:none;color:#171512}
.tile .ph{overflow:hidden;border-radius:20px;background:#F1FEC8}
.tile img{display:block;width:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tile:hover img{transform:scale(1.045)}
.tile:hover{color:#171512}
.tall{position:relative;display:block;border-radius:22px;overflow:hidden;text-decoration:none;color:#FAFBF4;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tall:hover{transform:translateY(-6px);color:#FFFFFF}
.tall img{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.tall:hover img{transform:scale(1.06)}
.fade{transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.bob{animation:bob 1.8s ease-in-out infinite}
.mqw{overflow:hidden;position:relative}
.mq{display:flex;width:max-content;animation:mq 40s linear infinite}
.mq.rev{animation-direction:reverse;animation-duration:70s}
.mqw:hover .mq{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 20s linear infinite}
.cursor{position:fixed;left:0;top:0;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(23,21,18,.5);pointer-events:none;z-index:100;transform:translate3d(-100px,-100px,0);display:none;mix-blend-mode:multiply}
@media (pointer:fine){.cursor{display:block}}
.par{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.hcard{position:relative;flex-shrink:0;border-radius:24px;overflow:hidden;background:#E6EDCF}
.pc-name{margin-top:10px;font-size:16px;font-weight:500;text-decoration:none;line-height:1.3}
.pc-size{font-size:13px;color:#5E6452;margin-top:4px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pc-price{font-size:20px;font-weight:600;letter-spacing:-.01em}
.pc-btn{min-height:44px;padding:0 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.pc-tag{position:absolute;top:14px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500}
@media (max-width:980px){.g4{gap:24px 12px}.pc-name{font-size:14px;margin-top:8px}.pc-size{font-size:12px}.pc-foot{flex-direction:column;align-items:stretch;gap:8px;margin-top:10px}.pc-price{font-size:17px}.pc-btn{min-height:40px;font-size:13px;padding:0 10px}.pc-tag{top:8px;padding:4px 8px;font-size:11px}.tile .ph{border-radius:16px}}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.two,.hero-split{grid-template-columns:minmax(0,1fr)}.navc{display:none!important}.wrap{padding:0 20px}.h1{font-size:40px!important}.h2{font-size:34px!important}.giant{font-size:26vw!important}}
@media (max-width:560px){.hdr{left:12px!important;right:12px!important;top:12px!important}.hide-s{display:none!important}.h-hint{bottom:132px!important}.h-card{left:16px;right:16px!important;bottom:20px!important;width:auto!important}.logo{padding:11px 16px!important}}
@media (prefers-reduced-motion:reduce){.bob,.mq,.spin{animation:none}.fade{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="position: relative; width: 100%; background: #FAFBF4; overflow-x: clip">
<div ref="{{curRef}}" class="cursor" aria-hidden="true"></div>

<header class="hdr" style="position: fixed; top: 16px; left: 24px; right: 24px; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="#top" class="glass logo" style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap; padding: 12px 20px; border-radius: 999px; text-decoration: none; color: #171512; border: 1px solid rgba(23,21,18,0.06)">
<span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">NEW ERA</span><i class="s" style="font-size: 19px">mebel</i>
</a>
<nav class="navc glass" aria-label="Главное меню" style="display: flex; gap: 2px; padding: 5px; border-radius: 999px; border: 1px solid rgba(23,21,18,0.06)">
<a class="nl" href="catalog.html">Каталог</a>
<a class="nl" href="kitchen.html">Кухни на заказ</a>
<a class="nl" href="catalog.html#kupe">Шкафы-купе</a>
<a class="nl" href="#delivery">Доставка и оплата</a>
<a class="nl" href="#contacts">Контакты</a>
</nav>
<div class="glass" style="display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; border: 1px solid rgba(23,21,18,0.06)">
<button type="button" class="ib hide-s" aria-label="Поиск" style="background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg></button>
<button type="button" class="ib hide-s" aria-label="Избранное" style="background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
<button type="button" class="ib" aria-label="Корзина" style="position: relative; background: transparent"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<sc-if value="{{hasCart}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #566B0E; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{cartCount}}</span></sc-if>
</button>
<a class="btn" href="kitchen.html" style="min-height: 44px; font-size: 14px; padding-left: 18px; padding-right: 5px; gap: 10px; white-space: nowrap"><span>Замер<span class="hide-s"> бесплатно</span></span><span class="dot" style="width: 34px; height: 34px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</div>
</header>

<main id="top">
<section ref="{{heroRef}}" aria-label="Как мы делаем мебель" style="position: relative; height: 100vh; height: 100svh">
<div style="position: relative; height: 100%; overflow: hidden; background: #E8ECDC">
<div ref="{{visRef}}" style="position: absolute; top: -12px; left: -18px; right: -18px; bottom: -12px; will-change: transform">
<img src="frames/k000.webp" alt="Комната, в которой будет собрана кухня" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<canvas ref="{{cvRef}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(250,251,244,0.72) 0%, rgba(250,251,244,0.2) 30%, rgba(250,251,244,0) 55%, rgba(40,28,18,0.16) 100%)"></div>

<div ref="{{txtRef}}" class="wrap" style="position: absolute; left: 0; right: 0; top: 128px; margin: 0 auto; will-change: transform">
<div style="position: relative; max-width: 620px; min-height: 280px">
<div class="fade" style="position: absolute; top: 0; left: 0; opacity: {{o0}}; transform: {{t0}}">
<h1 class="h1" style="margin: 0; font-size: 58px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 500">Мебель <i class="s" style="font-size: 1.12em">по вашим</i> размерам. <i class="s" style="font-size: 1.12em">Надолго.</i></h1>
<p style="margin: 20px 0 0; font-size: 18px; line-height: 1.55; color: #424737; max-width: 460px">Своё производство в Туркестане. Кухни, шкафы и корпусная мебель — готовая и на заказ.</p>
</div>
<div class="fade" style="position: absolute; top: 0; left: 0; opacity: {{o1}}; transform: {{t1}}">
<h2 class="h1" style="margin: 0; font-size: 58px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 500">Каждый шкаф — <i class="s" style="font-size: 1.12em">с точностью</i> до миллиметра.</h2>
<p style="margin: 20px 0 0; font-size: 18px; line-height: 1.55; color: #424737; max-width: 460px">Приезжаем на замер бесплатно и рисуем проект под вашу комнату.</p>
</div>
<div class="fade" style="position: absolute; top: 0; left: 0; opacity: {{o2}}; transform: {{t2}}">
<h2 class="h1" style="margin: 0; font-size: 58px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 500">ЛДСП, МДФ, камень <i class="s" style="font-size: 1.12em">и надёжная</i> фурнитура.</h2>
<p style="margin: 20px 0 0; font-size: 18px; line-height: 1.55; color: #424737; max-width: 460px">Всё делаем на своём производстве — без посредников и наценок.</p>
</div>
<div class="fade" style="position: absolute; top: 0; left: 0; opacity: {{o3}}; transform: {{t3}}">
<h2 class="h1" style="margin: 0; font-size: 58px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 500">Доставим, соберём <i class="s" style="font-size: 1.12em">и уберём</i> за собой.</h2>
<p style="margin: 20px 0 0; font-size: 18px; line-height: 1.55; color: #424737; max-width: 460px">Сборка входит в цену. По Туркестану доставка бесплатная.</p>
</div>
<div class="fade" style="position: absolute; top: 0; left: 0; opacity: {{o4}}; transform: {{t4}}; pointer-events: {{pe4}}">
<h2 class="h1" style="margin: 0; font-size: 58px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 500">Давайте сделаем <i class="s" style="font-size: 1.12em">вашу.</i></h2>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px">
<a class="btn" href="kitchen.html">Вызвать замерщика<span class="dot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
<a class="btn2 glass" href="catalog.html">Готовая мебель</a>
</div>
</div>
</div>
</div>

<div aria-hidden="true" class="giant" style="position: absolute; left: 0; right: 0; bottom: -3.2vw; text-align: center; font-size: 21vw; line-height: 0.8; font-weight: 600; letter-spacing: -0.055em; color: rgba(255,255,255,0.38); -webkit-text-stroke: 1px rgba(255,255,255,0.5); pointer-events: none; user-select: none; white-space: nowrap">NEW ERA</div>

<div class="glass h-card" style="position: absolute; right: 28px; bottom: 28px; width: 300px; padding: 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5); display: flex; gap: 14px; align-items: center; box-shadow: 0 20px 50px -30px rgba(40,28,18,0.6)">
<div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 14px; background: #171512; color: #FAFBF4; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{stepIcon}}"></path></svg>
</div>
<div style="flex-grow: 1; min-width: 0">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #5E6452"><span>Этап {{stepNum}} из 5</span><span>{{pct}}</span></div>
<div style="font-size: 16px; font-weight: 600; margin-top: 3px">{{stepName}}</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 9px">
<sc-for list="{{bars}}" as="item" hint-placeholder-count="5"><button type="button" onClick="{{item.go}}" aria-label="{{item.label}}" style="height: 16px; padding: 6px 0; border: 0; background: transparent; cursor: pointer"><span style="display: block; height: 4px; border-radius: 4px; background: {{item.bg}}; transition: background .5s"></span></button></sc-for>
</div>
</div>
</div>

<div aria-hidden="true" class="h-hint" style="position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: {{hintOp}}; transition: opacity .5s; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.14em; color: #FAFBF4">
{{hint}}
<svg class="bob" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
</div>
</div>
</section>
<div class="mqw" aria-label="Наши условия" style="border-bottom: 1px solid rgba(23,21,18,0.1); background: #171512; color: #FAFBF4; padding: 20px 0">
<div class="mq" style="gap: 0">
<sc-for list="{{mq}}" as="item" hint-placeholder-count="12"><span style="display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap">{{item.t}}<svg width="16" height="16" viewBox="0 0 24 24" fill="#C5E35A" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"></path></svg></span></sc-for>
</div>
</div>

<section style="padding: 140px 0 100px">
<div class="wrap hero-split">
<div>
<div style="font-size: 13px; letter-spacing: 0.12em; color: #566B0E; font-weight: 600">NEW ERA MEBEL</div>
<h2 class="h2" data-rv="0" style="margin: 16px 0 20px; font-size: 48px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 500">Мебель для дома — <i class="s" style="font-size: 1.1em">от готовой</i> до сделанной под вас</h2>

<a class="btn" href="catalog.html">Смотреть каталог<span class="dot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</div>
<div class="g3" style="gap: 16px">
<a class="tall" data-tilt="1" href="catalog.html" style="height: 460px; background: #F1FEC8">
<img src="img/nova_walnut.webp" alt="Шкаф-купе с зеркалом" class="par" data-par="0.1">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,21,18,0) 45%, rgba(23,21,18,0.72) 100%)"></div>
<div style="position: absolute; top: 18px; left: 18px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #171512; background: rgba(250,251,244,0.85)">Готовая мебель</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 20px">
<div style="font-size: 19px; font-weight: 600; line-height: 1.25">Шкафы, комоды, прихожие</div>

</div>
</a>
<a class="tall" data-tilt="1" href="kitchen.html" style="height: 460px; background: #D9E2BC">
<img src="img/kitchen_full.jpg" alt="Кухня с островом" class="par" data-par="0.1" style="object-position: 55% 50%">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,21,18,0) 45%, rgba(23,21,18,0.72) 100%)"></div>
<div style="position: absolute; top: 18px; left: 18px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #171512; background: rgba(250,251,244,0.85)">На заказ</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 20px">
<div style="font-size: 19px; font-weight: 600; line-height: 1.25">Кухни по вашим размерам</div>
<div style="font-size: 14px; opacity: 0.85; margin-top: 6px">Бесплатный замер и проект</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px"><span style="display: inline-flex; align-items: center; min-height: 32px; padding: 0 14px; border-radius: 999px; background: #FAFBF4; color: #171512; font-size: 13px; font-weight: 500">Рассчитать</span><span style="font-size: 44px; font-weight: 300; line-height: 0.8; opacity: 0.7">02</span></div>
</div>
</a>
<a class="tall" data-tilt="1" href="kitchen.html" style="height: 460px; background: #F1FEC8">
<img src="img/loft.webp" alt="Трёхдверный шкаф-купе" class="par" data-par="0.1">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,21,18,0) 45%, rgba(23,21,18,0.72) 100%)"></div>
<div style="position: absolute; top: 18px; left: 18px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #171512; background: rgba(250,251,244,0.85)">На заказ</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 20px">
<div style="font-size: 19px; font-weight: 600; line-height: 1.25">Шкафы-купе в нишу</div>
<div style="font-size: 14px; opacity: 0.85; margin-top: 6px">Под любую ширину и высоту</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px"><span style="display: inline-flex; align-items: center; min-height: 32px; padding: 0 14px; border-radius: 999px; background: #FAFBF4; color: #171512; font-size: 13px; font-weight: 500">Заказать</span><span style="font-size: 44px; font-weight: 300; line-height: 0.8; opacity: 0.7">03</span></div>
</div>
</a>
</div>

          el.style.transition = 'opacity 1s cubic-bezier(.2,.8,.2,1) ' + d + 's, transform 1s cubic-bezier(.2,.8,.2,1) ' + d + 's';
          el.style.opacity = '1'; el.style.transform = 'none'; el.__rv = 2;
        }
      }
      for (let i = 0; i < els.hs.length; i++) {
        const sec = els.hs[i], track = sec.querySelector('[data-hs-track]');
        if (!track) continue;
        const r = sec.getBoundingClientRect();
        const p = Math.min(1, Math.max(0, -r.top / Math.max(1, r.height - vh)));
        const dist = Math.max(0, track.scrollWidth - vw + 60);
        track.style.transform = 'translate3d(' + (-p * dist).toFixed(1) + 'px,0,0)';
        const bar = sec.querySelector('[data-hs-bar]');
        if (bar) bar.style.transform = 'scaleX(' + p.toFixed(3) + ')';
      }
      const cur = this.curRef && this.curRef.current;
      if (cur && fine) {
        cx += (tx - cx) * 0.22; cy += (ty - cy) * 0.22; big += (tbig - big) * 0.15;
        cur.style.transform = 'translate3d(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + (1 + big * 1.5).toFixed(3) + ')';
      }
      this.fxRaf = requestAnimationFrame(loop);
    };
    this.fxRaf = requestAnimationFrame(loop);
  }
  stopFx() {
    this.fxDead = true;
    if (this.fxRaf) cancelAnimationFrame(this.fxRaf);
    if (this.fxOff) this.fxOff();
  }
}
</script>
<script>DCLite.mount();</script>
